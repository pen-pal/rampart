# Rampart on AWS — EC2 + Docker prod-parity stack.
#
# Runs the published image against an EXTERNAL RDS / Aurora PostgreSQL (no
# Postgres container — the DB is managed). Use this on an EC2 box in the same
# VPC as RDS, or locally to smoke-test against RDS before deploying.
#
# Usage:
#   cp deploy/aws.env.example deploy/aws.env   # then edit DATABASE_URL etc.
#   docker compose --env-file deploy/aws.env -f deploy/compose.aws.yaml up -d
#   docker compose -f deploy/compose.aws.yaml logs -f rampart
#
# For ECS Fargate / App Runner, you don't use this file — you set the same env
# (deploy/aws.env.example) on the platform's task/service config. See
# docs/DEPLOY.md and docs/deploy/aws-vercel.md.
#
# Put a TLS-terminating reverse proxy (Caddy / nginx / an ALB) in front; this
# binds plain HTTP on 3000. See docs/deploy/README.md for proxy snippets.

services:
  rampart:
    image: ghcr.io/pen-pal/rampart:latest # pin a tag in prod, e.g. :0.156.79
    restart: unless-stopped
    environment:
      DATABASE_URL:                ${DATABASE_URL:?set DATABASE_URL in deploy/aws.env}
      RAMPART_SECRET_KEY:          ${RAMPART_SECRET_KEY:-}
      RAMPART_REQUIRE_SECRET_KEY:  ${RAMPART_REQUIRE_SECRET_KEY:-}
      RAMPART_LOG_FORMAT:          ${RAMPART_LOG_FORMAT:-json}
      RAMPART_TRUSTED_PROXIES:     ${RAMPART_TRUSTED_PROXIES:-}
      BIND_ADDR:                   0.0.0.0:3000
      RUST_LOG:                    ${RUST_LOG:-rampart=info,tower_http=warn,info}
    ports:
      - "${RAMPART_PORT:-3000}:3000"
    # ICMP / ping monitor needs raw sockets on Linux.
    cap_add:
      - NET_RAW
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      # /readyz is 200 only when the RDS pool can serve a query — gates the
      # orchestrator on the actual fix-this state, not just process-up.
      test:     ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/readyz"]
      interval: 10s
      timeout:  3s
      retries:  3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus:   "1.0"
        reservations:
          memory: 128M
    stop_signal: SIGTERM
    stop_grace_period: 30s
