# Default values for rampart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  repository: ghcr.io/pen-pal/rampart
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

replicaCount: 1

# Container resources for the rampart-api pod.
resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Pod-level security context.
podSecurityContext:
  fsGroup: 65534

# Container-level security context.
securityContext:
  runAsNonRoot: true
  runAsUser: 65534
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: rampart.example.com
      paths:
        - path: /
          pathType: Prefix
  # cert-manager integration. When enabled, the Ingress is annotated with
  # cert-manager.io/cluster-issuer and a TLS block is emitted per host so
  # cert-manager provisions certs for the dashboard host AND any status-page
  # custom domains listed below. Rampart itself never does ACME — TLS is the
  # ingress controller's job (see docs/deploy/README.md "TLS for custom domains").
  certManager:
    enabled: false
    clusterIssuer: letsencrypt-prod
  # Explicit TLS config. Used as-is when certManager.enabled=false. When
  # certManager.enabled=true, a tls entry is auto-generated per ingress host
  # (so you don't need to maintain this list by hand), but any entries you set
  # here are still emitted too.
  # Each entry may list multiple hosts under one secret.
  tls: []
  # - secretName: rampart-tls
  #   hosts:
  #     - rampart.example.com
  #     - status.acme.com

# Embedded Postgres — DISABLED BY DEFAULT.
# This is intended for local evaluation / dev only.
# Production deployments should bring their own managed Postgres
# (RDS, Cloud SQL, Neon, Supabase, etc.) and set externalDatabase.url.
postgres:
  embedded: false
  image: postgres:16-alpine
  storageSize: 10Gi
  # Credentials used by the embedded StatefulSet. Override these for any
  # non-throwaway deployment, even in the evaluation case.
  user: rampart
  database: rampart
  # If empty, a random password is generated on first install and stored
  # in the embedded-postgres Secret.
  password: ""

externalDatabase:
  # RECOMMENDED: reference an existing Secret holding the DSN. The app reads
  # DATABASE_URL straight from it (valueFrom), so the connection string never
  # lands in Helm values/release history.
  existingSecret: ""
  existingSecretKey: DATABASE_URL
  # Inline DSN (eval only — ends up in values + the chart-managed Secret).
  # Used when existingSecret is empty and postgres.embedded=false.
  # Format: postgres://user:pass@host:5432/dbname
  url: ""

# Session signing key. If empty, helm will generate a random 64-char key
# on install and persist it in the Secret. Lookup is used so upgrades do
# not rotate the key.
sessionKey: ""

# At-rest encryption key for notification channel secrets (webhook tokens,
# SMTP passwords, channel API keys). A 32-byte key as 64 hex chars or base64.
# If empty, helm auto-generates + persists one (encryption ON by default) —
# back it up. Losing it makes existing encrypted channel configs unreadable.
secretKey: ""

# Application config exposed via ConfigMap (non-secret).
config:
  bindAddr: "0.0.0.0:3000"
  rustLog: "info,rampart=debug"

# Extra environment variables.
env: []
# - name: FOO
#   value: bar

# Extra envFrom sources.
envFrom: []
# - secretRef:
#     name: my-extra-secret

# Probes
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

nodeSelector: {}
tolerations: []
affinity: {}

# Spread replicas across zones/nodes (works with replicaCount > 1 or autoscaling).
topologySpreadConstraints: []
# - maxSkew: 1
#   topologyKey: topology.kubernetes.io/zone
#   whenUnsatisfiable: ScheduleAnyway
#   labelSelector:
#     matchLabels: {}   # auto-filled with the chart selector labels

priorityClassName: ""

# Rolling-update strategy for the Deployment.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# Startup probe — gives the process time to run migrations on first boot before
# the liveness probe starts killing it. Shares the liveness path (/healthz).
startupProbe:
  enabled: true
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 3
  timeoutSeconds: 3
  failureThreshold: 30   # ~90s for migrations on a cold DB

# --- Horizontal Pod Autoscaler -------------------------------------------------
# Safe to scale: the API tier is stateless (all state in Postgres), and the
# scheduler / notifier / prune run only on the ONE replica that holds the
# Postgres advisory lock (leader election, rampart_db::leader). So extra
# replicas serve HTTP without duplicating probes or alerts (active-passive HA
# for the background work, active-active for the API).
#
# Two composition caveats to plan for when running >1 replica:
#
#   * Background-work failover takes up to ~25s, not instant. The lock is only
#     released when the dead leader's Postgres connection drops; a follower then
#     re-acquires on its next attempt (RETRY ~10s) after the keepalive window
#     (~15s) lapses. Probes/alerts pause for that window on an ungraceful leader
#     loss (a graceful SIGTERM hands off faster).
#   * OIDC login + the live SSE heartbeat stream are per-process. The OIDC PKCE
#     `state` is held in the leader/handling pod's memory, so an SSO round-trip
#     that lands on a different replica than it started on will fail — enable
#     session affinity (sticky sessions) at the ingress/Service if you use OIDC
#     across replicas. The SSE stream likewise comes from one process; all
#     REST/data endpoints work on every replica.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  # behavior: {}   # optional scaleUp/scaleDown stabilization windows

# --- Pod Disruption Budget -----------------------------------------------------
# Protects availability during voluntary disruptions (node drains, upgrades).
# Set ONE of minAvailable / maxUnavailable. Only meaningful with >1 replica.
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: ""

# --- Persistence (optional) ----------------------------------------------------
# Rampart is stateless — all data lives in Postgres — so persistence is OFF by
# default. Enable it only if you mount something at a custom path (e.g. an
# on-disk export dir). It does NOT replace the database.
persistence:
  enabled: false
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  mountPath: /var/lib/rampart
  annotations: {}

# Arbitrary extra volumes + mounts (config files, CA bundles, etc.).
extraVolumes: []
# - name: ca-bundle
#   configMap:
#     name: my-ca-bundle
extraVolumeMounts: []
# - name: ca-bundle
#   mountPath: /etc/ssl/certs/extra-ca.pem
#   subPath: ca.pem
#   readOnly: true

# --- Service mesh (Istio) ------------------------------------------------------
# For clusters that route via a mesh instead of a Kubernetes Ingress. Emits an
# Istio Gateway + VirtualService bound to an existing ingress-gateway. Pair with
# `ingress.enabled=false`. Requires the Istio CRDs.
istio:
  enabled: false
  gateway:
    enabled: true
    # Label selector of the istio ingress-gateway deployment to attach to.
    selector:
      istio: ingressgateway
    hosts:
      - rampart.example.com
    tls:
      enabled: false
      mode: SIMPLE          # SIMPLE | MUTUAL | PASSTHROUGH
      credentialName: ""    # K8s TLS secret name (in the gateway's namespace)
      httpsRedirect: true   # redirect :80 -> :443 when TLS is on
  virtualService:
    enabled: true
    # Gateways to bind. Empty => the gateway this chart creates.
    gateways: []
    hosts:
      - rampart.example.com
    timeout: ""
    retries: {}

# --- NetworkPolicy -------------------------------------------------------------
# Ingress policy restricts who can reach Rampart's port. Egress is OFF by
# default ON PURPOSE: Rampart is a monitor — it makes outbound probes to
# arbitrary user-defined targets (HTTP, DBs, TCP, ...) and posts to arbitrary
# notification webhooks, plus reaches Postgres + DNS. A restrictive egress
# policy will silently break monitoring/alerting, so only enable it if you
# know exactly which destinations you must allow.
networkPolicy:
  enabled: false
  ingress:
    enabled: true
    # Sources allowed to reach the app port. Empty => allow from anywhere.
    from: []
    # - namespaceSelector:
    #     matchLabels:
    #       kubernetes.io/metadata.name: ingress-nginx
  egress:
    enabled: false
    # When enabled you MUST allow at least DNS + Postgres + every probe/webhook
    # destination, or monitoring breaks. See the chart README for a skeleton.
    to: []

# --- Prometheus ServiceMonitor -------------------------------------------------
# Scrapes Rampart's built-in /metrics endpoint. Requires the Prometheus
# Operator (kube-prometheus-stack) CRDs.
serviceMonitor:
  enabled: false
  namespace: ""        # default: release namespace
  path: /metrics
  port: http
  interval: 30s
  scrapeTimeout: 10s
  labels: {}           # so your Prometheus serviceMonitorSelector matches
  relabelings: []
  metricRelabelings: []

# Stakater Reloader: when true, annotates the Deployment so it restarts on
# ConfigMap/Secret change (requires the Reloader controller).
configReloader:
  enabled: false
