# Dependabot policy.
#
# Goal: keep dependencies fresh without flooding the PR list. Dependabot
# v2 groups bundle multiple updates into a single PR per group/week.
# We split each ecosystem into two groups by `applies-to`:
#
#   * version-updates  — routine bumps (minor / patch / major), one PR
#                        per ecosystem per week. Majors land grouped so
#                        an obvious cluster like "axum 0.7 → 0.8 + tower
#                        0.5 → 0.6" arrives together instead of as ten
#                        racing PRs.
#   * security-updates — vulnerability fixes. Separate group so a CVE
#                        bump doesn't sit behind a routine major-bump
#                        review.
#
# `open-pull-requests-limit: 5` (down from 10) puts a hard ceiling on
# the queue per ecosystem — Dependabot reuses slots in priority order
# when more updates exist.

version: 2
updates:
  # ── Rust workspace ─────────────────────────────────────────────────
  - package-ecosystem: cargo
    directory: "/backend"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "area: backend"]
    commit-message:
      prefix: "deps(cargo)"
    groups:
      cargo-routine:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch", "major"]
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]

  # ── Frontend ───────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "area: frontend"]
    commit-message:
      prefix: "deps(npm)"
    groups:
      npm-routine:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch", "major"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  # ── GitHub Actions ─────────────────────────────────────────────────
  # Workflow action versions drift quietly; group monthly so the noise
  # is one PR not ten.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: ["dependencies", "area: ci"]
    commit-message:
      prefix: "ci(actions)"
    groups:
      actions-all:
        patterns: ["*"]

  # ── Docker base images ─────────────────────────────────────────────
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels: ["dependencies", "area: docker"]
    commit-message:
      prefix: "docker"
    groups:
      docker-all:
        patterns: ["*"]
