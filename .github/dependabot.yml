# Dependabot policy.
#
# Goal: keep dependencies fresh without flooding the PR list. Dependabot
# v2 groups bundle multiple updates into a single PR per group/week.
# We split each ecosystem into three groups:
#
#   * <eco>-routine   — minor + patch only. Safe-by-construction under
#                       semver; grouped so a fresh weekly run lands as
#                       one PR instead of ten racing ones. The bulk of
#                       what flows through CI on a normal week.
#   * <eco>-major     — semver-major bumps, also grouped. Each major in
#                       this PR is a deliberate review decision (api
#                       break, behavioural change, transitive crypto
#                       stack swap) so the PR is expected to need
#                       splitting / cherry-picking; the grouping just
#                       means we don't get ten separate PRs all needing
#                       the same review attention.
#   * <eco>-security  — vulnerability fixes. Separate so a CVE bump
#                       doesn't sit behind a routine review.
#
# Earlier revisions of this file collapsed routine + major into one
# group, which produced PRs that bundled ~18 semver-major bumps each.
# That made any individual review nearly impossible (e.g. rumqttc 0.25,
# which pulls aws-lc-rs + cmake — explicitly rejected — landed in the
# same PR as a benign uuid patch bump). Splitting the buckets keeps the
# routine PR mergeable and pushes the deliberate calls into a stream
# whose name announces it needs scrutiny.
#
# `open-pull-requests-limit: 5` (down from 10) puts a hard ceiling on
# the queue per ecosystem — Dependabot reuses slots in priority order
# when more updates exist.

version: 2
updates:
  # ── Rust workspace ─────────────────────────────────────────────────
  - package-ecosystem: cargo
    directory: "/backend"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "area: backend"]
    commit-message:
      prefix: "deps(cargo)"
    groups:
      cargo-routine:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      cargo-major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major"]
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]

  # ── Frontend ───────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "area: frontend"]
    commit-message:
      prefix: "deps(npm)"
    groups:
      npm-routine:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-major:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  # ── GitHub Actions ─────────────────────────────────────────────────
  # Workflow action versions drift quietly; group monthly so the noise
  # is one PR not ten.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: ["dependencies", "area: ci"]
    commit-message:
      prefix: "ci(actions)"
    groups:
      actions-all:
        patterns: ["*"]

  # ── Docker base images ─────────────────────────────────────────────
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels: ["dependencies", "area: docker"]
    commit-message:
      prefix: "docker"
    groups:
      docker-all:
        patterns: ["*"]
