version: 2
updates:
  # Rust workspace
  - package-ecosystem: cargo
    directory: "/backend"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: ["dependencies", "area: backend"]
    groups:
      # Batch low-risk patch/minor bumps so we don't drown in PRs.
      rust-minor-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps(cargo)"

  # Frontend
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: ["dependencies", "area: frontend"]
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps(npm)"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "area: ci"]
    commit-message:
      prefix: "deps(actions)"

  # Dockerfile base images
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "area: docker"]
    commit-message:
      prefix: "deps(docker)"
