# Rust dependency security + license/ban scanning.
#
# CodeQL can't analyze Rust, so cargo-deny is the Rust-side gate. Its
# `advisories` check scans the full RUSTSEC database (same source as
# cargo-audit) AND enforces the license policy + crate bans, reading the
# accepted-advisory ignore list from backend/deny.toml. We run it alone
# rather than also running cargo-audit, which would duplicate the RUSTSEC
# scan with a second, separately-maintained ignore list.
name: security-audit

on:
  push:
    branches: [main]
    paths:
      - "backend/**/Cargo.toml"
      - "backend/Cargo.lock"
      - "backend/deny.toml"
      - ".github/workflows/security-audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**/Cargo.toml"
      - "backend/Cargo.lock"
      - "backend/deny.toml"
  schedule:
    - cron: "0 5 * * 3"   # weekly, Wednesday 05:00 UTC — catches newly disclosed CVEs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo deny (advisories + licenses + bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: backend/Cargo.toml
          command: check
          arguments: --all-features
