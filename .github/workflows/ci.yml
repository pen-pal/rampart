# CI for Rampart.
#
# Pipelines:
#   backend-lint      cargo fmt --check, cargo clippy -D warnings (no DB)
#   backend-test      cargo test --workspace  with PG service + offline sqlx
#   frontend-lint     npm ci, build (no separate linter yet)
#   frontend-test     vitest run
#   e2e               full-stack Playwright (chromium only — fastest gate)
#
# All jobs run on push to main and on PRs. e2e is the slowest (~2 min);
# unit / integration jobs return in under 60s and gate before it.

name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE:     true

jobs:
  # ─── BACKEND ────────────────────────────────────────────────────────────
  backend-lint:
    name: backend · clippy + fmt
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: backend }
      # rampart-api embeds frontend/dist/ via rust-embed; the derive macro
      # errors at compile time if the folder is absent. This job doesn't
      # build the SPA, so stub an empty bundle just to satisfy the macro.
      - name: Stub embedded frontend bundle
        run: mkdir -p ../frontend/dist && touch ../frontend/dist/index.html
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Static guard: docs/openapi.yaml must document every REST route the
      # router registers. Catches "added a route, forgot the spec". No build
      # or DB needed — it greps the route source and diffs against the spec.
      - name: OpenAPI spec drift check
        run: bash ../scripts/check-openapi.sh
      # Guard: RBAC/membership mutations must emit an audit record (SOC2
      # access-review). Fails if an org-mutation handler drops its audit call.
      - name: Audit-coverage guard (RBAC mutations)
        run: bash ../scripts/check-audit-coverage.sh

  # Multi-DB P1: the off-by-default `sqlite` backend (runtime-checked queries +
  # a parallel migration set). No DB service — `#[sqlx::test]` spins a fresh
  # per-test SQLite database. SQLX_OFFLINE so the PG `query!` cache is used for
  # the rest of the crate without a live Postgres.
  backend-sqlite:
    name: backend · sqlite backend (multi-DB P1)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: backend }
    env:
      SQLX_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: backend }
      - name: clippy (sqlite feature)
        run: cargo clippy -p rampart-db --features sqlite --all-targets -- -D warnings
      - name: test (sqlite backend)
        run: cargo test -p rampart-db --features sqlite --lib sqlite::
      - name: build api (sqlite feature — the RAMPART_DB_URL=sqlite flip)
        run: cargo clippy -p rampart-api --features sqlite --bin rampart-api -- -D warnings

  backend-mysql:
    name: backend · mysql backend (multi-DB P2)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: backend }
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: rampart
          MYSQL_DATABASE: rampart_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prampart"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      SQLX_OFFLINE: "1"
      # sqlx::test creates a fresh per-test database off this server (root has
      # CREATE/DROP DATABASE), so the MySQL backend is exercised for real.
      DATABASE_URL: "mysql://root:rampart@127.0.0.1:3306/rampart_test"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: backend }
      - name: clippy (mysql feature)
        run: cargo clippy -p rampart-db --features mysql --all-targets -- -D warnings
      - name: test (mysql backend)
        run: cargo test -p rampart-db --features mysql --lib mysql::

  backend-test:
    name: backend · cargo test --workspace
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: backend }

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     rampart
          POSTGRES_PASSWORD: rampart
          POSTGRES_DB:       rampart
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rampart -d rampart"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      # sqlx::test creates its own per-test isolated databases against
      # the base URL we hand it; the DB at the URL is just the connection
      # entry point.
      DATABASE_URL: postgres://rampart:rampart@localhost:5432/rampart

    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: backend }
      # rampart-api embeds frontend/dist/ via rust-embed; the derive macro
      # errors at compile time if the folder is absent. This job doesn't
      # build the SPA, so stub an empty bundle just to satisfy the macro.
      - name: Stub embedded frontend bundle
        run: mkdir -p ../frontend/dist && touch ../frontend/dist/index.html
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features rustls,postgres --locked
      - name: Apply migrations to base DB
        run: sqlx migrate run --source migrations
      - name: cargo test --workspace
        # NOTE: we don't set SQLX_OFFLINE here — sqlx::test uses a live
        # base DB and creates per-test databases from it. Offline mode
        # would block test DB creation.
        env: { SQLX_OFFLINE: '' }
        run: cargo test --workspace --all-targets --no-fail-fast

  # ─── FRONTEND ───────────────────────────────────────────────────────────
  frontend-test:
    name: frontend · vitest + build
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # ─── E2E ────────────────────────────────────────────────────────────────
  # Cross-browser matrix — one job per engine so a Firefox-only regression
  # surfaces against a green Chromium run instead of hiding behind it. The
  # `chrome` + `msedge` branded channels reuse the Chromium engine but
  # exercise the real installer build (different default flags, UA, font
  # stack) so they catch enterprise-shipped-browser-specific bugs.
  #
  # Brave / Vivaldi / Arc / LibreWolf aren't bundled with Playwright;
  # they're Chromium / Firefox forks and are covered by the same engine
  # job — adding them would only catch repackaging differences a web UI
  # doesn't exercise.
  e2e:
    name: e2e · ${{ matrix.browser }}
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    defaults:
      run: { working-directory: frontend }

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit, chrome, msedge]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     rampart
          POSTGRES_PASSWORD: rampart
          POSTGRES_DB:       rampart
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rampart -d rampart"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      RAMPART_PG_CONTAINER: ""   # see container-vs-host note below
      DATABASE_URL: postgres://rampart:rampart@localhost:5432/rampart_test

    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: backend }
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features rustls,postgres --locked

      # Frontend bundle MUST build before the backend: rampart-api embeds
      # frontend/dist/ via rust-embed, whose derive macro errors at compile
      # time if the folder is absent. (backend-lint / backend-test stub an
      # empty dist; the e2e job needs the real bundle anyway, so just build
      # it first.)
      - name: Install frontend deps + build bundle
        run: |
          npm ci
          npm run build

      - name: Build backend (debug)
        working-directory: backend
        run: cargo build -p rampart-api

      - name: Install Playwright browser (${{ matrix.browser }})
        # Bundled engines (chromium / firefox / webkit) install their own
        # binary + system deps. Branded channels (chrome / msedge) install
        # the real Chrome / Edge .deb via Playwright's helper.
        run: |
          if [[ "${{ matrix.browser }}" == "chrome" || "${{ matrix.browser }}" == "msedge" ]]; then
            npx playwright install --with-deps chromium ${{ matrix.browser }}
          else
            npx playwright install --with-deps ${{ matrix.browser }}
          fi

      - name: Patch start-api.sh for CI (no docker exec; use psql against host)
        run: |
          # In CI we're not running PG in `docker exec` — it's a service
          # container reachable on localhost:5432. Rewrite the wrapper to
          # use psql directly.
          cat > e2e/start-api.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          export PGPASSWORD=rampart
          DB="rampart_test"
          REPO_ROOT="$(cd "$(dirname "$0")/../.." && pwd)"
          BACKEND="${REPO_ROOT}/backend"
          psql -h localhost -U rampart -d postgres -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = '${DB}';" >/dev/null 2>&1 || true
          psql -h localhost -U rampart -d postgres -c "DROP DATABASE IF EXISTS ${DB};" >/dev/null
          psql -h localhost -U rampart -d postgres -c "CREATE DATABASE ${DB} OWNER rampart;" >/dev/null
          DATABASE_URL="postgres://rampart:rampart@localhost:5432/${DB}" \
            sqlx migrate run --source "${BACKEND}/migrations"
          export DATABASE_URL="postgres://rampart:rampart@localhost:5432/${DB}"
          export BIND_ADDR="${BIND_ADDR:-0.0.0.0:3001}"
          export RUST_LOG="${RUST_LOG:-rampart=warn,tower_http=warn}"
          export SQLX_OFFLINE="${SQLX_OFFLINE:-true}"
          exec "${BACKEND}/target/debug/rampart-api"
          SH
          chmod +x e2e/start-api.sh

      - name: Install psql client (for the wrapper script)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Playwright (${{ matrix.browser }})
        run: npx playwright test --project=${{ matrix.browser }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}
          path: frontend/playwright-report/
          retention-days: 7
