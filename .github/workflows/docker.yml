# Build + push the Rampart container image.
#
# Triggers:
#   - push to main           → publish :main + :sha-<short> (multi-arch)
#   - push of a v* tag       → publish :<semver>, :<major.minor>, :latest
#   - workflow_dispatch      → publish :manual-<sha> (manual smoke push)
#
# All images are pushed to GHCR under the calling repo's namespace.
#
# Multi-arch strategy:
#
#   Each architecture builds on its own native runner (amd64 on
#   `ubuntu-latest`, arm64 on `ubuntu-24.04-arm`). The two per-arch
#   pushes use docker/build-push-action's digest-only mode (no tag);
#   a final job pulls both digests and assembles them into the
#   user-facing multi-arch tag via `docker buildx imagetools create`.
#
#   The previous layout built both arches sequentially on one amd64
#   runner using QEMU. arm64 under QEMU runs Rust compilation
#   ~5-10x slower; with no warm buildcache on the first push, the
#   serial build exceeded 2 hours. Native arm64 + parallel matrix
#   keeps each leg under 30 minutes and the assemble step adds
#   ~30 seconds.

name: docker

on:
  push:
    branches: [main]
    tags:     ['v*']
  workflow_dispatch:

permissions:
  contents:  read
  packages:  write
  id-token:  write

env:
  REGISTRY: ghcr.io
  IMAGE:    ${{ github.repository }}

jobs:
  # ── per-arch builds in parallel ───────────────────────────────────
  build:
    name: build · ${{ matrix.platform.tag }}
    runs-on: ${{ matrix.platform.runner }}
    # Hard ceiling so a single arch can't hang the whole pipeline. The
    # 90-min cap is well above the observed P95 (~28 min cold-cache,
    # amd64) and well below the failure mode we just got out of
    # (>2h serial QEMU emulation).
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        platform:
          - { tag: amd64,  arch: linux/amd64, runner: ubuntu-latest }
          - { tag: arm64,  arch: linux/arm64, runner: ubuntu-24.04-arm }

    steps:
      - uses: actions/checkout@v4

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Derive labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}

      - name: Build + push (digest only)
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file:    Dockerfile
          platforms: ${{ matrix.platform.arch }}
          # Push by digest only; the merge job tags the final manifest.
          # Two separate buildcache refs so amd64 and arm64 prime
          # independently — otherwise the first finisher overwrites the
          # second's layer set and we get a full rebuild next time.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels:  ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE }}:buildcache-${{ matrix.platform.tag }}
          cache-to:   type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE }}:buildcache-${{ matrix.platform.tag }},mode=max
          provenance: false

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.push.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.platform.tag }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ── merge per-arch digests into a single multi-arch tag ───────────
  merge:
    name: assemble manifest
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 10

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=manual-${{ github.sha }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Create + push multi-arch manifest
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          # `docker buildx imagetools create` takes one -t per tag and
          # accepts <image>@<digest> source refs.
          tag_args=()
          while IFS= read -r tag; do
            tag_args+=("-t" "$tag")
          done <<< '${{ steps.meta.outputs.tags }}'

          digest_args=()
          for f in *; do
            digest_args+=("${{ env.REGISTRY }}/${{ env.IMAGE }}@sha256:${f}")
          done

          docker buildx imagetools create "${tag_args[@]}" "${digest_args[@]}"

      - name: Inspect resulting manifest
        run: |
          docker buildx imagetools inspect \
            "${{ env.REGISTRY }}/${{ env.IMAGE }}:sha-$(echo '${{ github.sha }}' | cut -c1-7)"
