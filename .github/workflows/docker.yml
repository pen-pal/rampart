# Build + push the Rampart container image.
#
# Triggers:
#   - push to main           → publish :main + :sha-<short> (multi-arch)
#   - push of a v* tag       → publish :<semver>, :<major.minor>, :latest
#   - workflow_dispatch      → publish :manual-<sha> (manual smoke push)
#
# All images are pushed to GHCR under the calling repo's namespace.

name: docker

on:
  push:
    branches: [main]
    tags:     ['v*']
  workflow_dispatch:

permissions:
  contents:  read
  packages:  write
  id-token:  write

env:
  REGISTRY: ghcr.io
  IMAGE:    ${{ github.repository }}

jobs:
  build:
    name: build + push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive tags + labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=manual-${{ github.sha }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          file:    Dockerfile
          # arm64 builds are emulated via QEMU; ~5x slower than amd64 on
          # GHA runners. Keep both — most self-hosters are on either.
          platforms: linux/amd64,linux/arm64
          push:    true
          tags:    ${{ steps.meta.outputs.tags }}
          labels:  ${{ steps.meta.outputs.labels }}
          # Buildx inline cache: each push primes the next build.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE }}:buildcache
          cache-to:   type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE }}:buildcache,mode=max
          provenance: false
