# Path-based auto-labeling for PRs. Consumed by .github/workflows/labeler.yml
# (actions/labeler v5 syntax).

"area: backend":
  - changed-files:
      - any-glob-to-any-file: "backend/**"

"area: db":
  - changed-files:
      - any-glob-to-any-file: "backend/migrations/**"

"area: frontend":
  - changed-files:
      - any-glob-to-any-file: "frontend/**"

"area: docs":
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "**/*.md"

"area: ci":
  - changed-files:
      - any-glob-to-any-file: ".github/**"

"area: docker":
  - changed-files:
      - any-glob-to-any-file:
          - "Dockerfile"
          - ".dockerignore"
          - "compose.yaml"

"dependencies":
  - changed-files:
      - any-glob-to-any-file:
          - "backend/Cargo.lock"
          - "frontend/package-lock.json"
