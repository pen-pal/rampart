  /v1/notifications/counts:
    get:
      tags: [Notifications]
      summary: Notification channel counts
      responses:
        '200': { description: Channel counts by kind. }
  /v1/notifications/{id}/tags:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Notifications]
      summary: List tags on a notification channel
      responses:
        '200': { description: Tag ids. }
  /v1/notifications/{id}/tags/{tag_id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: tag_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Notifications]
      summary: Tag a notification channel
      responses:
        '204': { description: Tagged. }
    delete:
      tags: [Notifications]
      summary: Untag a notification channel
      responses:
        '204': { description: Untagged. }
  /v1/notification-templates/preview:
    post:
      tags: [Notifications]
      summary: Render a template against sample data
      responses:
        '200': { description: Rendered preview. }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ─────────────────────────── Folders (extended: tags + channels) ───────────
  /v1/monitor-groups/{id}/tags:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Folders]
      summary: List a folder's tags
      responses:
        '200': { description: Tag ids. }
  /v1/monitor-groups/{id}/tags/{tag_id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: tag_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Folders]
      summary: Tag a folder
      responses:
        '204': { description: Tagged. }
    delete:
      tags: [Folders]
      summary: Untag a folder
      responses:
        '204': { description: Untagged. }
  /v1/monitor-groups/{id}/channels:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Folders]
      summary: List a folder's notification channels
      responses:
        '200': { description: Channel ids. }
  /v1/monitor-groups/{id}/channels/{notif_id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: notif_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Folders]
      summary: Attach a channel to a folder
      responses:
        '204': { description: Attached. }
    delete:
      tags: [Folders]
      summary: Detach a channel from a folder
      responses:
        '204': { description: Detached. }

  # ─────────────────────────── Maintenance (extended) ───────────────────────
  /v1/maintenance-windows/{id}/active:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Maintenance]
      summary: Toggle a maintenance window active/inactive
      responses:
        '204': { description: Updated. }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────────── 2FA (TOTP) ───────────────────────────────────
  /v1/auth/2fa/verify:
    post:
      tags: [Auth]
      summary: Verify a TOTP code during login
      description: Public step of the two-factor login flow. Rate-limited per IP.
      security: []
      responses:
        '200': { description: Verified; session established. }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/auth/2fa/setup:
    post:
      tags: [Auth]
      summary: Begin TOTP enrolment
      description: Self-service. Returns the secret + provisioning URI.
      responses:
        '200': { description: Enrolment secret + otpauth URI. }
  /v1/auth/2fa/enable:
    post:
      tags: [Auth]
      summary: Enable TOTP after confirming a code
      description: Self-service.
      responses:
        '204': { description: Enabled. }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/auth/2fa/disable:
    post:
      tags: [Auth]
      summary: Disable TOTP for the current user
      description: Self-service.
      responses:
        '204': { description: Disabled. }

  # ─────────────────────────── Web push (self-service) ──────────────────────
  /v1/webpush/vapid-key:
    get:
      tags: [Auth]
      summary: Fetch the server VAPID public key
      responses:
        '200': { description: VAPID public key. }
  /v1/webpush/subscriptions:
    post:
      tags: [Auth]
      summary: Register a browser push subscription
      description: Self-service.
      responses:
        '204': { description: Subscribed. }
    delete:
      tags: [Auth]
      summary: Remove a browser push subscription
      description: Self-service.
      responses:
        '204': { description: Unsubscribed. }

  # ─────────────────────────── Dashboard prefs (self-service) ───────────────
  /v1/me/prefs:
    get:
      tags: [Auth]
      summary: Get the caller's dashboard preferences
      responses:
        '200': { description: Saved views + default folder. }
    put:
      tags: [Auth]
      summary: Replace the caller's dashboard preferences
      responses:
        '204': { description: Saved. }

  # ─────────────────────────── Real-time stream ─────────────────────────────
  /v1/stream/heartbeats:
    get:
      tags: [Monitors]
      summary: Server-Sent Events stream of live heartbeats
      responses:
        '200':
          description: An SSE stream.
          content:
            text/event-stream: {}

  # ─────────────────────────── Audit (extended) ─────────────────────────────
  /v1/audit-log/csv:
    get:
      tags: [Audit]
      summary: Audit log as CSV (inline)
      description: Admin only.
      responses:
        '200':
          description: CSV body.
          content:
            text/csv: {}

  # ─────────────────────────── Users (extended) ─────────────────────────────
  /v1/users/{id}/admin:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Users]
      summary: Grant or revoke admin on a user
      description: Admin only. Legacy alias for role assignment.
      responses:
        '204': { description: Updated. }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────────── Settings (admin) ─────────────────────────────
  /v1/settings/smtp:
    get:
      tags: [Ingest]
      summary: Get SMTP settings
      description: Admin only.
      responses:
        '200': { description: SMTP configuration. }
    put:
      tags: [Ingest]
      summary: Update SMTP settings
      description: Admin only.
      responses:
        '204': { description: Saved. }
  /v1/settings/retention:
    get:
      tags: [Ingest]
      summary: Get data-retention settings
      description: Admin only.
      responses:
        '200': { description: Retention configuration. }
    put:
      tags: [Ingest]
      summary: Update data-retention settings
      description: Admin only.
      responses:
        '204': { description: Saved. }

  # ─────────────────────────── Ingest tokens (extended) ─────────────────────
  /v1/ingest-tokens/{id}/mapping:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Ingest]
      summary: Set or clear an ingest token's generic JSON mapping
      description: Admin only. A null mapping clears it.
      responses:
        '204': { description: Saved. }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/public/ingest/generic/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Ingest]
      summary: Generic operator-mapped JSON receiver
      description: Public — the token IS the auth. Requires a configured mapping.
      security: []
      responses:
        '202': { description: Accepted. }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ─────────────────────────── Subscribers (admin + public) ─────────────────
  /v1/status-pages/{id}/subscribers:
