        '200': { description: Recorded. }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────────── Monitors (extended) ───────────────────────────
  # Path-level coverage filled in to keep scripts/check-openapi.sh green.
  # These mirror handlers in routes/monitors.rs, routing.rs, notifications.rs,
  # tags.rs and monitor_groups.rs; request/response bodies are summarised, not
  # fully enumerated (see the source for the canonical contract).
  /v1/monitors/summary:
    get:
      tags: [Monitors]
      summary: Aggregate status summary across all monitors
      responses:
        '200': { description: Summary counts + per-monitor latest state. }
  /v1/monitors/history:
    get:
      tags: [Monitors]
      summary: Recent heartbeat history across all monitors
      responses:
        '200': { description: Combined recent history. }
  /v1/monitors/bulk:
    post:
      tags: [Monitors]
      summary: Bulk-create monitors
      description: Editor or admin.
      responses:
        '200': { description: Created monitors. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/monitors/{id}/heartbeats.csv:
    parameters:
      - $ref: '#/components/parameters/MonitorId'
    get:
      tags: [Monitors]
      summary: Heartbeat history as CSV
      responses:
        '200':
          description: CSV export.
          content:
            text/csv: {}
  /v1/monitors/{id}/pause:
    parameters:
      - $ref: '#/components/parameters/MonitorId'
    post:
      tags: [Monitors]
      summary: Pause a monitor
      responses:
        '204': { description: Paused. }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/monitors/{id}/resume:
    parameters:
      - $ref: '#/components/parameters/MonitorId'
    post:
      tags: [Monitors]
      summary: Resume a paused monitor
      responses:
        '204': { description: Resumed. }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/monitors/{id}/clone:
    parameters:
      - $ref: '#/components/parameters/MonitorId'
    post:
      tags: [Monitors]
      summary: Clone a monitor
      responses:
        '201':
          description: The cloned monitor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Monitor' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/monitors/{id}/test-now:
    parameters:
      - $ref: '#/components/parameters/MonitorId'
    post:
      tags: [Monitors]
      summary: Run a probe immediately
      responses:
        '200': { description: Probe result. }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/monitors/{id}/regenerate-push-token:
    parameters:
      - $ref: '#/components/parameters/MonitorId'
    post:
      tags: [Monitors]
      summary: Regenerate a push monitor's secret token
      responses:
        '200': { description: New token. }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/monitors/{id}/notifications:
    parameters:
      - $ref: '#/components/parameters/MonitorId'
    get:
      tags: [Notifications]
      summary: List notification channels attached to a monitor
      responses:
        '200': { description: Attached channel ids. }
  /v1/monitors/{id}/notifications/{nid}:
    parameters:
      - $ref: '#/components/parameters/MonitorId'
      - name: nid
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Notifications]
      summary: Attach a notification channel to a monitor
      responses:
        '204': { description: Attached. }
    delete:
      tags: [Notifications]
      summary: Detach a notification channel from a monitor
      responses:
        '204': { description: Detached. }
  /v1/monitors/{id}/tags:
    parameters:
      - $ref: '#/components/parameters/MonitorId'
    get:
      tags: [Tags]
      summary: List a monitor's tags
      responses:
        '200': { description: Tag ids. }
  /v1/monitors/{id}/dependencies:
    parameters:
      - $ref: '#/components/parameters/MonitorId'
    get:
      tags: [Folders]
      summary: List a monitor's dependencies
      responses:
        '200': { description: Dependency monitor ids. }
  /v1/monitors/{id}/dependencies/{parent_id}:
    parameters:
      - $ref: '#/components/parameters/MonitorId'
      - name: parent_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Folders]
      summary: Add a dependency edge
      responses:
        '204': { description: Added. }
    delete:
      tags: [Folders]
      summary: Remove a dependency edge
      responses:
        '204': { description: Removed. }
  /v1/monitors/{id}/effective-channels:
    parameters:
      - $ref: '#/components/parameters/MonitorId'
    get:
      tags: [Notifications]
      summary: Resolved notification channels that will fire for this monitor
      responses:
        '200': { description: Effective channel ids. }
  /v1/monitors/{id}/excludes:
    parameters:
      - $ref: '#/components/parameters/MonitorId'
    get:
      tags: [Notifications]
      summary: List per-monitor channel excludes
      responses:
        '200': { description: Excluded channel ids. }
  /v1/monitors/{id}/excludes/{notif_id}:
    parameters:
      - $ref: '#/components/parameters/MonitorId'
      - name: notif_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Notifications]
      summary: Exclude a channel for a monitor
      responses:
        '204': { description: Excluded. }
    delete:
      tags: [Notifications]
      summary: Remove a channel exclude
      responses:
        '204': { description: Removed. }

  # ─────────────────────────── Tags / Notifications (extended) ───────────────
  /v1/tags/usage:
    get:
