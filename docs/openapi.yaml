    get:
      tags: [Ingest]
      summary: Get SMTP settings
      description: Admin only.
      responses:
        '200': { description: SMTP configuration. }
    put:
      tags: [Ingest]
      summary: Update SMTP settings
      description: Admin only.
      responses:
        '204': { description: Saved. }
  /v1/settings/retention:
    get:
      tags: [Ingest]
      summary: Get data-retention settings
      description: >-
        Admin only. The effective per-tier windows (days): `heartbeats`,
        `rollup_days`, `metrics_days`, `traces_days`, `logs_days`, `rum_days`,
        `profiles_days`, `audit_log` — stored blob merged with defaults.
      responses:
        '200': { description: 'Retention config `{heartbeats, rollup_days, metrics_days, traces_days, logs_days, rum_days, profiles_days, audit_log}` (days).' }
    put:
      tags: [Ingest]
      summary: Update data-retention settings
      description: >-
        Admin only. Body is the full retention config (all tiers in days);
        omitted tiers fall back to defaults. Each window must be 1–36500.
      responses:
        '204': { description: Saved; next prune tick applies it. }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/settings/telemetry-token:
    get:
      tags: [Ingest]
      summary: Get the telemetry ingest token
      description: >-
        Admin only. Returns `{token}` (empty string when unset). The optional
        shared secret guarding the OTLP trace/log and RUM ingest endpoints —
        blank leaves them open (the operator controls network exposure).
      responses:
        '200': { description: 'Current token, `{token: "<value or empty>"}`.' }
    put:
      tags: [Ingest]
      summary: Set or clear the telemetry ingest token
      description: >-
        Admin only. Body `{token}`; an empty/blank token clears it (re-opening
        the OTLP + RUM ingest surfaces). Once set, collectors must present it as
        `Authorization: Bearer <token>` / `X-Rampart-Token`, and the RUM snippet
        forwards it via `data-token` (`?k=`).
      responses:
        '204': { description: Saved. }
  /v1/settings/siem-export:
    get:
      tags: [Audit]
      summary: Get the SIEM export config
      description: >-
        Admin only. `{ enabled, kind, target }`. Streams the audit log to an
        external sink (webhook or syslog). See docs/design/SIEM.md.
      responses:
        '200': { description: '`{ enabled, kind: "webhook"|"syslog", target }`.' }
    put:
      tags: [Audit]
      summary: Set the SIEM export config
      description: >-
        Admin only. Body `{ enabled, kind, target }`. `kind` is `webhook`
        (HTTP POST a JSON array) or `syslog` (UDP RFC5424 line/event); `target`
        is the URL or `host:port`. Forwarding is leader-gated.
      responses:
        '204': { description: Saved. }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/settings/security:
    get:
      tags: [Audit]
      summary: Get the 2FA-enforcement policy
      responses:
        '200': { description: '`{ require_2fa: "off"|"admins"|"all" }`.' }
    put:
      tags: [Audit]
      summary: Set the 2FA-enforcement policy
      description: 'Admin only. Body `{ require_2fa }`. Users it applies to must enrol 2FA before using the app.'
      responses:
        '204': { description: Saved. }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/settings/storage:
    get:
      tags: [Audit]
      summary: Per-tier storage footprint
      description: >-
        Admin only. On-disk size + estimated row count of each high-volume
        telemetry table, largest first — the data-footprint panel.
      responses:
        '200': { description: '`[{ table, bytes, rows }]` (bytes incl. indexes + TOAST; rows is a planner estimate).' }

  # ─────────────────────────── Account sessions ─────────────────────
  /v1/sessions:
    get:
      tags: [Auth]
      summary: List the caller's active sessions
      responses:
        '200': { description: '`[{ id, ip_addr, user_agent, created_at, expires_at, current }]`.' }
  /v1/sessions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Auth]
      summary: Revoke one of the caller's sessions
      responses:
        '204': { description: Revoked. }
        '404': { description: No such session for the caller. }
  /v1/sessions/revoke-others:
    post:
      tags: [Auth]
      summary: Sign out the caller's other devices
      responses:
        '200': { description: '`{ revoked }` — count of other sessions ended; current kept.' }

  # ─────────────────────────── Ingest tokens (extended) ─────────────────────
  /v1/ingest-tokens/{id}/mapping:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Ingest]
      summary: Set or clear an ingest token's generic JSON mapping
      description: Admin only. A null mapping clears it.
      responses:
        '204': { description: Saved. }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/public/ingest/generic/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Ingest]
      summary: Generic operator-mapped JSON receiver
      description: Public — the token IS the auth. Requires a configured mapping.
      security: []
      responses:
        '202': { description: Accepted. }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ─────────────────────────── Subscribers (admin + public) ─────────────────
  /v1/status-pages/{id}/subscribers:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Status Pages]
      summary: List subscribers for a status page
      description: Editor or admin.
      responses:
        '200': { description: Subscribers. }
  /v1/subscribers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Status Pages]
      summary: Delete a subscriber
      description: Editor or admin.
      responses:
        '204': { description: Deleted. }
  /v1/public/status-pages/{slug}/subscribe:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Status Pages]
      summary: Subscribe to a status page
      description: Public. Sends a confirmation email.
      security: []
      responses:
        '202': { description: Confirmation email sent. }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/public/subscribe/unsubscribe/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Status Pages]
      summary: One-click unsubscribe
      security: []
      responses:
        '200': { description: Unsubscribed (HTML confirmation). }
  /v1/public/subscribers/manage/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Status Pages]
      summary: Subscriber self-management page
      security: []
      responses:
        '200': { description: Management page (HTML). }
  /v1/public/subscribers/manage/{token}/unsubscribe-all:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Status Pages]
      summary: Unsubscribe from all status pages
      security: []
      responses:
        '200': { description: Unsubscribed from all. }
  /v1/public/subscribers/manage/{token}/unsubscribe/{slug}:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string }
      - name: slug
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Status Pages]
      summary: Unsubscribe from a single status page
      security: []
      responses:
        '200': { description: Unsubscribed from the page. }

  # ─────────────────────────── Status page feeds (extended) ─────────────────
  /v1/public/status-pages/{slug}/day-latency:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Status Pages]
      summary: Per-day latency series for a public status page
      security: []
      responses:
        '200': { description: Latency buckets. }
  /v1/public/status-pages/{slug}/incidents/{incident_id}/feed.atom:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
      - name: incident_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Status Pages]
      summary: Atom feed for a single incident
      security: []
      responses:
        '200':
          description: Atom feed.
          content:
            application/atom+xml: {}
  /v1/public/status-pages/{slug}/incidents/{incident_id}/feed.rss:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
      - name: incident_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Status Pages]
      summary: RSS feed for a single incident
      security: []
      responses:
        '200':
          description: RSS feed.
          content:
            application/rss+xml: {}
  /v1/monitors/bulk-by-tag:
    post:
      tags: [Monitors]
      summary: Pause/resume all monitors carrying a tag
      description: 'Body { tag_id, action: pause|resume }. Editor/admin.'
      responses:
        '200': { description: 'Affected count { affected }.' }
  /v1/monitors/presets:
    get:
      tags: [Monitors]
      summary: List monitor presets (reusable header/TLS bags)
      responses:
        '200': { description: Presets. }
    post:
      tags: [Monitors]
      summary: Create a monitor preset
      responses:
        '201': { description: Created. }
  /v1/monitors/presets/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Monitors]
      summary: Get a monitor preset
      responses:
        '200': { description: Preset. }
    delete:
      tags: [Monitors]
      summary: Delete a monitor preset
      responses:
        '204': { description: Deleted. }
  /v1/monitor-templates:
    get:
      tags: [Monitors]
      summary: List monitor templates (reusable whole-monitor specs)
      responses:
        '200': { description: Templates. }
    post:
      tags: [Monitors]
      summary: Create a monitor template
      description: Editor or admin. `spec` is a monitor-creation body stored verbatim.
      responses:
        '201': { description: Created. }
  /v1/monitor-templates/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Monitors]
      summary: Get a monitor template
      responses:
        '200': { description: Template. }
    delete:
      tags: [Monitors]
      summary: Delete a monitor template
      responses:
        '204': { description: Deleted. }
  /v1/monitor-templates/{id}/instantiate:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Monitors]
      summary: Create a monitor from a template
      description: >-
        Editor or admin. Builds a new monitor from the template's stored spec;
        an optional `name` in the body overrides the spec name.
      responses:
        '201': { description: The created monitor. }
  /v1/scheduled-reports:
    get:
      tags: [Notifications]
      summary: List scheduled uptime reports
      responses:
        '200': { description: Reports. }
    post:
      tags: [Notifications]
      summary: Create a scheduled report
      responses:
        '201': { description: Created. }
  /v1/scheduled-reports/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Notifications]
      summary: Update a scheduled report
      responses:
        '200': { description: Updated. }
    delete:
      tags: [Notifications]
      summary: Delete a scheduled report
      responses:
        '204': { description: Deleted. }
  /v1/scheduled-reports/{id}/send:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Notifications]
      summary: Send a scheduled report now
      description: >-
        Admin only. Render and email the report immediately (out of band of its
        cadence) and stamp `last_sent_at`.
      responses:
        '204': { description: Sent. }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/status-pages/{id}/sections:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Status Pages]
      summary: List a page's component sections
      responses:
        '200': { description: Sections. }
    post:
      tags: [Status Pages]
      summary: Create a component section
      responses:
        '201': { description: Created. }
  /v1/status-pages/{id}/sections/{section_id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: section_id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Status Pages]
      summary: Rename / reorder a section
      responses:
        '200': { description: Updated. }
    delete:
      tags: [Status Pages]
      summary: Delete a section (its monitors become ungrouped)
      responses:
        '204': { description: Deleted. }
  /v1/status-pages/{id}/monitors/{monitor_id}/section:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: monitor_id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [Status Pages]
      summary: Assign a monitor to a section (null = ungroup)
      responses:
        '200': { description: Assigned. }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: rampart_session
      description: HTTP-only session cookie set by `/v1/auth/login`.
    bearerApiKey:
      type: http
      scheme: bearer
      bearerFormat: rmp_<32 chars>
      description: Personal API key created via `/v1/api-keys`.

  parameters:
    MonitorId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    StatusPageId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IncidentId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    MaintenanceId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    NotificationId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IngestToken:
      name: token
      in: path
      required: true
      description: Page-scoped ingest credential.
      schema: { type: string }

  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated but lacks the required role.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Conflict with current state.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
      description: Error envelope produced by `ApiError`.

    Role:
      type: string
      enum: [admin, editor, readonly]

    MonitorStatus:
      type: string
      enum: [up, down, warn, paused, pending, maintenance]

    MonitorKind:
      type: string
      description: Probe type. Serialized snake_case. The full set the binary supports.
      enum:
        - http
        - keyword
        - json_query
        - tcp
        - ping
        - dns
        - push
        - grpc
        - tls
        - docker
        - steam
        - mqtt
        - radius
        - kafka
        - postgres
        - mysql
        - mssql
        - redis
        - mongodb
        - memcached
        - ntp
        - websocket
        - nats
        - ldap
        - amqp
        - doh
        - rdap
        - snmp
        - cassandra
        - mdns
        - ssdp
        - domain
        - browser
        - ssh
        - smtp
        - imap
        - ftp
        - pop3
        - synthetic

    ChannelKind:
      type: string
      description: Notification channel kind. Serialized snake_case. ~130 supported; a representative subset is listed; `custom` is the catch-all webhook.
      enum:
        - slack
        - discord
        - telegram
        - email
        - webhook
        - pagerduty
        - sms_twilio
        - teams
        - gotify
        - pushover
        - ntfy
        - mattermost
        - matrix
        - signal
        - rocket_chat
        - google_chat
        - apprise
        - custom
        - webpush

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: [string, 'null'] }
        is_admin: { type: boolean, description: 'Derived rollback shim; prefer role.' }
        role: { $ref: '#/components/schemas/Role' }
        created_at: { type: string, format: date-time }
        last_login_at: { type: [string, 'null'], format: date-time }
        totp_enabled: { type: boolean }
      required: [id, email, is_admin, role, created_at]

    RegisterInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        name: { type: string }
        password: { type: string, minLength: 10 }

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    Monitor:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { $ref: '#/components/schemas/MonitorKind' }
        url: { type: [string, 'null'] }
        hostname: { type: [string, 'null'] }
        port: { type: [integer, 'null'] }
        config: { type: object, description: 'Kind-specific config (JSONPath, RRtype, container name, etc.).' }
        interval_seconds: { type: integer }
        retry_interval_sec: { type: integer }
        max_retries: { type: integer }
        timeout_seconds: { type: integer }
        resend_interval_sec: { type: integer }
        upside_down: { type: boolean }
        http_method: { type: string }
        http_body: { type: [string, 'null'] }
        http_headers: { type: [object, 'null'] }
        accepted_statuses: { type: array, items: { type: integer } }
        follow_redirect: { type: boolean }
        ignore_tls: { type: boolean }
        proxy_id: { type: [string, 'null'], format: uuid }
        push_token: { type: [string, 'null'] }
        last_push_at: { type: [string, 'null'], format: date-time }
        active: { type: boolean }
        current_status: { $ref: '#/components/schemas/MonitorStatus' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        tags: { type: array, items: { $ref: '#/components/schemas/TagBrief' } }
        cert_days_left: { type: [integer, 'null'] }
        cert_subject: { type: [string, 'null'] }
        cert_checked_at: { type: [string, 'null'], format: date-time }
        group_id: { type: [string, 'null'], format: uuid }
        slo_target_pct: { type: [number, 'null'], format: double }
        slo_window_days: { type: [integer, 'null'] }
      required: [id, name, kind, config, interval_seconds, timeout_seconds, active, current_status, created_at, updated_at]

    NewMonitor:
      type: object
      required: [name, kind]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        kind: { $ref: '#/components/schemas/MonitorKind' }
        url: { type: string, description: 'http/keyword/json_query/tls/domain.' }
        hostname: { type: string, description: 'tcp/ping/dns/grpc/database kinds.' }
        port: { type: integer }
        config: { type: object }
        interval_seconds: { type: integer, minimum: 10, maximum: 86400, default: 60 }
        timeout_seconds: { type: integer, minimum: 1, maximum: 600, default: 16 }
        max_retries: { type: integer, default: 0 }
        retry_interval_sec: { type: integer, default: 60 }
        resend_interval_sec: { type: integer, default: 0 }
        upside_down: { type: boolean, default: false }
        http_method: { type: string, default: GET }
        http_body: { type: string }
        http_headers: { type: object }
        accepted_statuses: { type: array, items: { type: integer }, default: [200, 201, 202, 203, 204, 205, 206, 207, 208, 226] }
        follow_redirect: { type: boolean, default: true }
        ignore_tls: { type: boolean, default: false }
        proxy_id: { type: string, format: uuid }
        group_id: { type: string, format: uuid }
        slo_target_pct: { type: number, format: double, minimum: 90.0, maximum: 100.0 }
        slo_window_days: { type: integer, minimum: 1, maximum: 90 }

    UpdateMonitor:
      type: object
      description: Partial update. Omitted fields are unchanged. `kind` is immutable so it is absent. `group_id` / `slo_target_pct` / `slo_window_days` accept explicit `null` to clear.
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        url: { type: [string, 'null'] }
        hostname: { type: [string, 'null'] }
        port: { type: [integer, 'null'] }
        config: { type: object }
        interval_seconds: { type: integer, minimum: 10, maximum: 86400 }
        timeout_seconds: { type: integer, minimum: 1, maximum: 600 }
        max_retries: { type: integer }
        retry_interval_sec: { type: integer }
        resend_interval_sec: { type: integer }
        upside_down: { type: boolean }
        http_method: { type: string }
        http_body: { type: [string, 'null'] }
        http_headers: { type: [object, 'null'] }
        accepted_statuses: { type: array, items: { type: integer } }
        follow_redirect: { type: boolean }
        ignore_tls: { type: boolean }
        proxy_id: { type: [string, 'null'], format: uuid }
        group_id: { type: [string, 'null'], format: uuid }
        slo_target_pct: { type: [number, 'null'], format: double }
        slo_window_days: { type: [integer, 'null'] }

    Heartbeat:
      type: object
      properties:
        monitor_id: { type: string, format: uuid }
        ts: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/MonitorStatus' }
        latency_ms: { type: [integer, 'null'] }
        status_code: { type: [integer, 'null'] }
        msg: { type: [string, 'null'] }
        retries: { type: integer }
        important: { type: boolean, description: 'True at the point status flipped.' }
      required: [monitor_id, ts, status, retries, important]

    Reliability:
      type: object
      properties:
        window_days: { type: integer, format: int64 }
        mtbf_secs: { type: [integer, 'null'], format: int64 }
        mttr_secs: { type: [integer, 'null'], format: int64 }
        downtime_events: { type: integer, format: int64 }
      required: [window_days, downtime_events]

    StatusPage:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        description: { type: [string, 'null'] }
        theme: { type: string }
        custom_domain: { type: [string, 'null'] }
        logo_url: { type: [string, 'null'] }
        custom_css: { type: [string, 'null'] }
        private: { type: boolean, description: 'True when a password is set; the hash is never serialized.' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        monitor_ids: { type: array, items: { type: string, format: uuid } }
      required: [id, slug, title, theme, private, created_at, updated_at]

    NewStatusPage:
      type: object
      required: [slug, title]
      properties:
        slug: { type: string, minLength: 2, maxLength: 40, pattern: '^[a-z0-9-]{2,40}$' }
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string }
        theme: { type: string, default: light }
        custom_domain: { type: string }
        logo_url: { type: string }
        custom_css: { type: string, description: 'Capped at 64 KB.' }
        password: { type: string, description: 'Write-only; sets the page private.' }
        monitor_ids: { type: array, items: { type: string, format: uuid } }

    UpdateStatusPage:
      type: object
      description: Partial update. `description`/`custom_domain`/`logo_url`/`custom_css`/`password` use triple-state — explicit `null` clears, omission leaves unchanged. `monitor_ids` when present REPLACES the attached set.
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, 'null'] }
        theme: { type: string }
        custom_domain: { type: [string, 'null'] }
        logo_url: { type: [string, 'null'] }
        custom_css: { type: [string, 'null'] }
        password: { type: [string, 'null'] }
        monitor_ids: { type: array, items: { type: string, format: uuid } }

    PublicStatusPage:
      type: object
      description: Unauthenticated projection. No probe targets / channel info. Locked pages return only slug/title/private until unlocked.
      properties:
        slug: { type: string }
        title: { type: string }
        description: { type: [string, 'null'] }
        theme: { type: string }
        custom_domain: { type: [string, 'null'] }
        logo_url: { type: [string, 'null'] }
        custom_css: { type: [string, 'null'] }
        private: { type: boolean }
        generated_at: { type: string, format: date-time }
        monitors:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              current_status: { $ref: '#/components/schemas/MonitorStatus' }
              uptime_90d: { type: [number, 'null'], format: float }
              avg_latency_ms_24h: { type: [number, 'null'], format: float }
              daily_status_90d: { type: string, description: '90 chars; u/d/w/m/n per day.' }
              monthly_uptime_12mo:
                type: array
                items:
                  type: object
                  properties:
                    year_month: { type: string, format: date }
                    uptime_pct: { type: [number, 'null'], format: float }
        incidents:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              content: { type: string }
              style: { $ref: '#/components/schemas/IncidentStyle' }
              pinned: { type: boolean }
              created_at: { type: string, format: date-time }
              updates:
                type: array
                items:
                  type: object
                  properties:
                    message: { type: string }
                    posted_at: { type: string, format: date-time }
        incident_history:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              content: { type: string }
              style: { $ref: '#/components/schemas/IncidentStyle' }
              created_at: { type: string, format: date-time }
              resolved_at: { type: string, format: date-time }
        maintenance:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              description: { type: [string, 'null'] }
              starts_at: { type: string, format: date-time }
              ends_at: { type: [string, 'null'], format: date-time }
              active: { type: boolean }
      required: [slug, title, theme, private, generated_at, monitors, incidents]

    IncidentStyle:
      type: string
      enum: [info, warning, danger, primary, success]

    Incident:
      type: object
      properties:
        id: { type: string, format: uuid }
        status_page_id: { type: string, format: uuid }
        title: { type: string }
        content: { type: string }
        style: { $ref: '#/components/schemas/IncidentStyle' }
        pinned: { type: boolean }
        active: { type: boolean }
        resolved_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        created_by: { type: [string, 'null'], format: uuid }
        dedup_key: { type: [string, 'null'], description: 'Set by webhook ingest to match a resolve back to its open.' }
      required: [id, status_page_id, title, content, style, pinned, active, created_at]

    NewIncident:
      type: object
      required: [title, content]
      properties:
        title: { type: string }
        content: { type: string }
        style: { $ref: '#/components/schemas/IncidentStyle' }
        pinned: { type: boolean }

    IncidentUpdate:
      type: object
      properties:
        id: { type: string, format: uuid }
        incident_id: { type: string, format: uuid }
        message: { type: string }
        posted_at: { type: string, format: date-time }
        posted_by: { type: [string, 'null'], format: uuid }
      required: [id, incident_id, message, posted_at]

    Recurrence:
      type: object
      description: Tagged union on `kind`. `none` (single-shot), `daily`, or `weekly` (with `weekdays` 0=Sun..6=Sat). `until` is an optional RFC3339 end.
      properties:
        kind: { type: string, enum: [none, daily, weekly] }
        weekdays: { type: array, items: { type: integer, minimum: 0, maximum: 6 } }
        until: { type: string, format: date-time }
      required: [kind]

    MaintenanceWindow:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, 'null'] }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
        monitor_ids: { type: array, items: { type: string, format: uuid } }
        recurrence: { $ref: '#/components/schemas/Recurrence' }
      required: [id, name, start_at, end_at, active, created_at]

    NewMaintenanceWindow:
      type: object
      required: [name, start_at, end_at]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        monitor_ids: { type: array, items: { type: string, format: uuid } }
        recurrence: { $ref: '#/components/schemas/Recurrence' }

    UpdateMaintenanceWindow:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, 'null'] }
        start_at: { type: string, format: date-time }
        end_at: { type: string, format: date-time }
        recurrence: { $ref: '#/components/schemas/Recurrence' }

    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { $ref: '#/components/schemas/ChannelKind' }
        config: { type: object, description: 'Kind-specific config. Secrets encrypted before insert.' }
        is_default: { type: boolean }
        template_id: { type: [string, 'null'], format: uuid }
        active: { type: boolean }
        last_fired_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        cooldown_seconds: { type: integer }
      required: [id, name, kind, config, is_default, active, created_at]

    NewNotification:
      type: object
      required: [name, kind, config]
      properties:
        name: { type: string }
        kind: { $ref: '#/components/schemas/ChannelKind' }
        config: { type: object }
        is_default: { type: boolean }
        template_id: { type: [string, 'null'], format: uuid }
        active: { type: boolean }
        cooldown_seconds: { type: integer }

    NotificationTemplate:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        channel_kinds: { type: array, items: { type: string } }
        event_kind: { type: string }
        subject_template: { type: [string, 'null'] }
        body_template: { type: string }
        is_default: { type: boolean }
        created_at: { type: string, format: date-time }
      required: [name, channel_kinds, event_kind, body_template]

    Tag:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { type: string, description: '#rrggbb' }
        created_at: { type: string, format: date-time }
      required: [id, name, color, created_at]

    TagBrief:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { type: string }
      required: [id, name, color]

    IncidentTemplate:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        body: { type: string }
        style: { $ref: '#/components/schemas/IncidentStyle' }
        created_at: { type: string, format: date-time }
      required: [id, name, body, style, created_at]

    NewIncidentTemplate:
      type: object
      required: [name, body]
      properties:
        name: { type: string }
        body: { type: string }
        style: { $ref: '#/components/schemas/IncidentStyle' }

    NewTag:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        color: { type: string, default: '#14b8a6' }

    UpdateTag:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        color: { type: string }

    MonitorGroup:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        sort_order: { type: integer }
        parent_id: { type: [string, 'null'], format: uuid }
        created_at: { type: string, format: date-time }
      required: [id, name, sort_order, created_at]

    NewMonitorGroup:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        sort_order: { type: integer, default: 0 }
        parent_id: { type: string, format: uuid }

    UpdateMonitorGroup:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        sort_order: { type: integer }
        parent_id: { type: [string, 'null'], format: uuid, description: 'null moves to root.' }

    ApiKey:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        key_prefix: { type: string, description: 'First 8 chars of the raw key.' }
        scopes: { type: array, items: { type: string } }
        created_by: { type: [string, 'null'], format: uuid }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, 'null'], format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
      required: [id, name, key_prefix, scopes, created_at]

    NewApiKey:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        scopes: { type: array, items: { type: string } }
        expires_at: { type: string, format: date-time }

    IssuedApiKey:
      type: object
      description: One-shot creation response. `token` is shown only here.
      properties:
        key: { $ref: '#/components/schemas/ApiKey' }
        token: { type: string, description: 'Full plaintext token, rmp_<32 chars>.' }
      required: [key, token]

    Proxy:
      type: object
      properties:
        id: { type: string, format: uuid }
        protocol: { type: string, enum: [http, https, socks, socks5, socks4] }
        host: { type: string }
        port: { type: integer }
        auth: { type: boolean }
        username: { type: [string, 'null'] }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
      required: [id, protocol, host, port, auth, active, created_at]

    NewProxy:
      type: object
      required: [protocol, host, port]
      properties:
        protocol: { type: string, minLength: 1, maxLength: 16 }
        host: { type: string, minLength: 1, maxLength: 255 }
        port: { type: integer, minimum: 1, maximum: 65535 }
        username: { type: string }
        password: { type: string, description: 'Write-only; never serialized back.' }
        active: { type: boolean, default: true }

    IngestTokenModel:
      type: object
      properties:
        id: { type: string, format: uuid }
        status_page_id: { type: string, format: uuid }
        token: { type: string, description: 'Opaque URL credential; safe to show the page admin.' }
        label: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, 'null'], format: date-time }
      required: [id, status_page_id, token, created_at]

    AuditEntry:
      type: object
      description: Append-only audit row. Secret-bearing payload fields are redacted before storage.
      properties:
        id: { type: string, format: uuid }
        actor_user_id: { type: [string, 'null'], format: uuid }
        actor_api_key_id: { type: [string, 'null'], format: uuid }
        action: { type: string, example: monitor.create }
        resource_kind: { type: string, example: monitor }
        resource_id: { type: [string, 'null'], format: uuid }
        payload: { type: [object, 'null'] }
        ip_addr: { type: [string, 'null'] }
        user_agent: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
    DeliveryLogEntry:
      type: object
      description: One notification delivery attempt (success or failure) recorded by the notifier.
      properties:
        id: { type: integer, format: int64 }
        notification_id: { type: [string, 'null'], format: uuid, description: Source channel; null if the channel was since deleted (FK ON DELETE SET NULL). }
        channel_kind: { type: string, example: email }
        event_kind: { type: string, example: monitor_down }
        monitor_id: { type: [string, 'null'], format: uuid }
        ok: { type: boolean }
        error: { type: [string, 'null'], description: Failure detail when ok=false. }
        sent_at: { type: string, format: date-time }

security:
  - sessionCookie: []
  - bearerApiKey: []
