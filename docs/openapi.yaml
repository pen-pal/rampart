              schema: { type: string }
  /v1/audit-log/verify:
    get:
      tags: [Audit]
      summary: Verify the audit hash chain
      description: >-
        Admin only. Re-walks the tamper-evident hash chain and reports whether
        it's intact. `ok: false` with `first_bad_id` means a row at/after that
        id was edited, deleted or reordered.
      responses:
        '200': { description: '`{ ok, checked, first_bad_id }`.' }
  /v1/audit-log/insights:
    get:
