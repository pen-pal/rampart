  # ─────────────────────────── Agents ──────────────────────────
  /v1/agents:
    get:
      tags: [Agents]
      summary: List remote probe agents
      description: >-
        Editor+. Names, locations, self-reported versions, liveness
        (`online` = polled within the last 90s) and assigned-monitor
        counts. Token material never appears on reads.
      responses:
        '200': { description: Agents. }
    post:
      tags: [Agents]
      summary: Register an agent
      description: >-
        Admin only. Returns the raw `rmpa_…` bearer token exactly once;
        only its SHA-256 hash is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:     { type: string, maxLength: 80 }
                location: { type: string, maxLength: 120 }
      responses:
        '201': { description: 'Created. Body: `{ agent, token }` — the only time the token is shown.' }
  /v1/agents/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Agents]
      summary: Rename / relocate an agent
      description: Admin only. An empty-string `location` clears it.
      responses:
        '200': { description: Updated agent. }
    delete:
      tags: [Agents]
      summary: Revoke an agent
      description: >-
        Admin only. The token dies immediately and the agent's monitors
        fall back to local probing (`agent_id` → null via ON DELETE SET
        NULL); the scheduler picks them up on the next reconcile.
      responses:
        '204': { description: Revoked. }
  /v1/agent/monitors:
    get:
      tags: [Agents]
      summary: Pull assigned monitors (agent wire protocol)
      description: >-
        Authenticated by `Authorization: Bearer rmpa_…` — no session. Returns
        the full specs of the monitors assigned to the calling agent and
        bumps its liveness (plus the self-reported
        `X-Rampart-Agent-Version` header when present).
      security: []
      responses:
        '200': { description: Assigned monitors. }
        '401': { description: Unknown or revoked token. }
  /v1/agent/metrics:
    post:
      tags: [Agents, Metrics]
      summary: Push host/custom metrics (agent wire protocol)
      description: >-
        Bearer-token authed Prometheus text ingest. Every sample gets an
        `agent="<name>"` label injected server-side before storage, so
        dashboards and threshold rules can tell hosts apart. The
        rampart-agent's built-in collector pushes host_cpu_pct,
        host_mem_used_pct/total/used bytes, host_load1/5/15,
        host_uptime_seconds, and per-mount host_disk_used_pct /
        host_disk_total_bytes here every 60s.
      security: []
      requestBody:
        required: true
        content:
          text/plain:
            schema: { type: string, example: "host_cpu_pct 12.5" }
      responses:
        '200': { description: '`{ accepted, skipped }`.' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: Unknown or revoked token. }
  /v1/agent/heartbeats:
    post:
      tags: [Agents]
      summary: Report probe results (agent wire protocol)
      description: >-
        Bearer-token authed batch ingestion (max 1000 results). Each entry
        is validated independently — the monitor must exist and be assigned
        to the reporting agent — so one bad row never sinks the batch.
        Accepted results flow through the same pipeline as local probes
        (status flips, notifications, SLO checks, result webhooks). The
        server stamps receive time; agent clocks are not trusted.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required: [monitor_id, status]
                properties:
                  monitor_id:  { type: string, format: uuid }
                  status:      { type: string, enum: [up, down, warn] }
                  latency_ms:  { type: integer }
                  status_code: { type: integer }
                  msg:         { type: string }
                  retries:     { type: integer }
      responses:
        '200': { description: '`{ accepted, rejected: [{monitor_id, reason}] }`.' }
        '401': { description: Unknown or revoked token. }

  # ─────────────────────────── Metrics ─────────────────────────
  /v1/metrics/ingest:
    post:
      tags: [Metrics]
      summary: Ingest metric samples (Prometheus text format)
      description: >-
        Pushgateway-style. The raw request body is Prometheus text
        exposition; samples are server-stamped (client timestamps in the
        payload are ignored). Returns `{ accepted, skipped }`. Max 10,000
        samples per push. Editor sessions or write-scope API keys.
      requestBody:
        required: true
        content:
          text/plain:
            schema: { type: string, example: "queue_depth{queue=\"emails\"} 42" }
      responses:
        '200': { description: '`{ accepted, skipped }`.' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/metrics/series:
    get:
      tags: [Metrics]
      summary: List known metric series
      description: Distinct (name, label-set) pairs with freshness + sample counts, newest activity first (max 1000).
      responses:
        '200': { description: Series. }
  /v1/metrics/query:
    get:
      tags: [Metrics]
      summary: Bucketed range query for one series
      parameters:
        - { name: name, in: query, required: true, schema: { type: string } }
        - { name: labels, in: query, required: false, description: 'JSON object of the exact label set (series identity, not a matcher). Default {}.', schema: { type: string } }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: step_seconds, in: query, required: false, description: 'Bucket width, clamped to [10, 86400]. Default 300.', schema: { type: integer } }
      responses:
        '200': { description: 'Epoch-aligned `[{ts, avg, min, max, samples}]` buckets, ascending.' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/metrics/rules:
    get:
      tags: [Metrics]
      summary: List threshold alert rules
      responses:
        '200': { description: Rules, including live breach_since / firing_at state. }
    post:
      tags: [Metrics]
      summary: Create a threshold alert rule
      description: >-
        A rule watches one series (metric + exact label set) and fires
        through its `channel_ids` when the latest sample breaches
        `op`/`threshold` continuously for `for_seconds` (0 = immediately).
        A series silent for 15+ minutes resolves rather than firing on
        stale data.
      responses:
        '201': { description: Created rule. }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/metrics/rules/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Metrics]
      summary: Update a rule
      description: Any edit resets in-flight breach/firing state.
      responses:
        '200': { description: Updated rule. }
    delete:
      tags: [Metrics]
      summary: Delete a rule
      responses:
        '204': { description: Deleted. }

  # ─────────────────────── Alerting (tiers) ─────────────────────
  /v1/silences:
    get:
      tags: [Alerting]
      summary: List active alert silences
      responses:
        '200': { description: '`[{ id, monitor_id, monitor_name, reason, created_at, expires_at }]`.' }
    post:
      tags: [Alerting]
      summary: Create an alert silence
      description: >-
        Mute notifications. Body `{ monitor_id?, reason?, duration_minutes? }` —
        omit monitor_id for a global mute; omit/0 duration for indefinite.
        Enforced at the notifier dispatch chokepoint.
      responses:
        '201': { description: '`{ id }`.' }
  /v1/silences/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Alerting]
      summary: Remove a silence
      responses:
        '204': { description: Removed. }
        '404': { description: No such silence. }
  /v1/telemetry-rules:
    get:
      tags: [Alerting]
      summary: List telemetry alert rules
      responses:
        '200': { description: Rules, including live breach_since / firing_at state. }
    post:
      tags: [Alerting]
      summary: Create a telemetry alert rule
      description: >-
        A rule evaluates a rolling-window aggregate over one observability
        tier and fires through its `channel_ids` when it breaches
        `op`/`threshold` continuously for `for_seconds` (0 = immediately).
        `kind` selects the aggregate: `error_rate` (error events / window,
        optional project in `target`), `trace_latency` (p95 span duration_ms,
        optional service in `target`), `trace_error_rate` (percent of error
        spans), `log_volume` (matching log count, with `min_level` and an
        optional body `match_text`). `window_seconds` is the rolling window;
        empty `target` = all. See docs/design/ALERT-RULES.md.
      responses:
        '201': { description: Created rule. }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/telemetry-rules/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Alerting]
      summary: Update a telemetry alert rule
      description: Any edit resets in-flight breach/firing state.
      responses:
        '200': { description: Updated rule. }
    delete:
      tags: [Alerting]
      summary: Delete a telemetry alert rule
      responses:
        '204': { description: Deleted. }

  # ─────────────────────── Detection (SIEM) ─────────────────────────
  /v1/detection-rules:
    get:
      tags: [Detection]
      summary: List detection rules
      responses:
        '200': { description: 'Rules, incl. `last_checked_at` watermark.' }
    post:
      tags: [Detection]
      summary: Create a detection rule
      description: >-
        A SIEM-style rule over the log tier. Each scheduler tick counts NEW log
        records matching the rule (`service` scope, `min_level` OTLP severity
        floor, optional `body_regex` case-insensitive POSIX regex); when the
        count reaches `threshold` it raises a finding and notifies
        `channel_ids`. `severity` is one of low/medium/high/critical. An invalid
        `body_regex` is a 400. See docs/design/DETECTION.md.
      responses:
        '201': { description: Created rule. }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/detection-rules/findings:
    get:
      tags: [Detection]
      summary: List detection findings
      parameters:
        - { name: open, in: query, required: false, schema: { type: boolean }, description: Only unacknowledged findings. }
        - { name: limit, in: query, required: false, schema: { type: integer }, description: Max rows (default 100, capped 1000). }
      responses:
        '200': { description: 'Findings newest-first `{rule_name, severity, match_count, sample, service, window_from, window_to, acknowledged_at}`.' }
  /v1/detection-rules/findings/{id}/ack:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Detection]
      summary: Acknowledge a finding
      responses:
        '200': { description: The acknowledged finding. }
        '404': { description: No such finding. }
  /v1/detection-rules/preview:
    post:
      tags: [Detection]
      summary: Dry-run a rule spec over recent logs
      description: >-
        Run a match spec (`service`, `min_level`, `body_regex`, `attr_key` /
        `attr_val`, `window_seconds`) over the trailing window without saving a
        rule or raising a finding — the "test rule" path for authoring. An
        invalid `body_regex` is a 400.
      responses:
        '200': { description: '`{count, samples[]}` — match count + up to 5 newest matching log lines.' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/detection-rules/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Detection]
      summary: Update a detection rule
      responses:
        '200': { description: Updated rule. }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      tags: [Detection]
      summary: Delete a detection rule
      responses:
        '204': { description: Deleted (its findings cascade). }

  # ─────────────────────── Escalations ─────────────────────────
  /v1/escalation-policies:
    get:
      tags: [Escalations]
      summary: List escalation policies
      responses:
        '200': { description: Policies with step ladders + monitor counts. }
    post:
      tags: [Escalations]
      summary: Create an escalation policy
      description: >-
        steps = ordered [{wait_seconds, channel_ids, schedule_ids}] (1–10
        steps, every step needs at least one channel or on-call schedule,
        step 1 must be immediate). A step's schedule_ids resolve to their
        current on-call channel when the step fires (see /v1/on-call-schedules).
        A monitor that references a policy routes its Down-flips through the
        ladder instead of regular channel fan-out; escalation pages bypass
        digest coalescing and quiet hours. See docs/ESCALATIONS.md.
      responses:
        '201': { description: Created policy. }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/escalation-policies/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Escalations]
      summary: Update a policy
      responses:
        '200': { description: Updated policy. }
    delete:
      tags: [Escalations]
      summary: Delete a policy
      description: Monitors referencing it fall back to regular channel fan-out.
      responses:
        '204': { description: Deleted. }
  /v1/monitors/{id}/escalation:
    parameters:
      - $ref: '#/components/parameters/MonitorId'
    get:
      tags: [Escalations]
      summary: The monitor's open escalation episode
      responses:
        '200': { description: 'Episode `{last_step, next_escalation_at, acked_at, …}` or `null`.' }
  /v1/monitors/{id}/escalation/ack:
    parameters:
      - $ref: '#/components/parameters/MonitorId'
    post:
      tags: [Escalations]
      summary: Acknowledge the open episode
      description: Stops further ladder steps; records the acking user. Recovery still resolves and notifies.
      responses:
        '200': { description: Acked episode. }
        '404': { description: Nothing open, or already acked. }

  # ─────────────────────────── Traces ───────────────────────────
  /otlp/v1/traces:
    post:
      tags: [Traces]
      summary: OTLP trace ingest
      description: >-
        Accepts an OTLP ExportTraceServiceRequest as OTLP/JSON
        (application/json) or OTLP/protobuf (application/x-protobuf). Public
        (network-scoped, no session) — point an OTel SDK/Collector OTLP/HTTP
        exporter at http://<host>/otlp. See docs/design/TRACES.md.
      responses:
        '200': { description: 'Empty ExportTraceServiceResponse `{}` = full success.' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/traces:
    get:
      tags: [Traces]
      summary: Recent traces (filterable)
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer } }
        - { name: service, in: query, required: false, schema: { type: string }, description: Trace involves this service. }
        - { name: min_duration_ms, in: query, required: false, schema: { type: number }, description: Minimum total trace duration. }
        - { name: errors_only, in: query, required: false, schema: { type: boolean }, description: Only traces with an error span. }
        - { name: q, in: query, required: false, schema: { type: string }, description: Substring on root op / service / trace_id. }
      responses:
        '200': { description: One row per trace_id — root service/op, duration, span + error counts. }
  /v1/traces/service-map:
    get:
      tags: [Traces]
      summary: Service dependency map
      parameters:
        - { name: hours, in: query, required: false, schema: { type: integer } }
      responses:
        '200': { description: 'Edges `[{from_service, to_service, calls}]` from cross-service spans.' }
  /v1/traces/operations:
    get:
      tags: [Traces]
      summary: APM rollup per service+operation
      description: >-
        Spans grouped by `(service, operation)` over the window with call
        volume, error count + rate, and p50/p95/p99/avg/max latency.
      parameters:
        - { name: service, in: query, required: false, schema: { type: string } }
        - { name: hours, in: query, required: false, schema: { type: integer } }
      responses:
        '200': { description: '`[{service, operation, calls, errors, error_rate, p50_ms, p95_ms, p99_ms, avg_ms, max_ms}]`.' }
  /v1/traces/export.csv:
    get:
      tags: [Traces]
      summary: Export traces as CSV
      description: >-
        Same filters as `/v1/traces`, one row per trace. `limit` is clamped to
        50,000 rows. Returns `text/csv` as a file attachment.
      parameters:
        - { name: service, in: query, required: false, schema: { type: string } }
        - { name: min_duration_ms, in: query, required: false, schema: { type: number } }
        - { name: errors_only, in: query, required: false, schema: { type: boolean } }
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer } }
      responses:
        '200': { description: 'CSV: started_at,trace_id,root_service,root_name,duration_ms,span_count,error_count,services.' }
  /v1/traces/{trace_id}:
    parameters:
      - { name: trace_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Traces]
      summary: Spans of a trace (waterfall)
      responses:
        '200': { description: All spans for the trace, ordered by start time. }
        '404': { description: No spans for that trace_id. }

  # ─────────────────────────── Logs ───────────────────────────
  /otlp/v1/logs:
    post:
      tags: [Logs]
      summary: OTLP log ingest
      description: >-
        Accepts an OTLP ExportLogsServiceRequest as OTLP/JSON or
        OTLP/protobuf. Public (network-scoped). See docs/design/LOGS.md.
      responses:
        '200': { description: 'Empty ExportLogsServiceResponse `{}` = success.' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/logs:
    get:
      tags: [Logs]
      summary: Recent logs (filtered)
      parameters:
        - { name: service,  in: query, required: false, schema: { type: string } }
        - { name: level,    in: query, required: false, schema: { type: string, enum: [trace, debug, info, warn, error, fatal] } }
        - { name: q,        in: query, required: false, schema: { type: string } }
        - { name: trace_id, in: query, required: false, schema: { type: string } }
        - { name: limit,    in: query, required: false, schema: { type: integer } }
      responses:
        '200': { description: Logs newest-first; level is a minimum, q is a body substring. }
  /v1/logs/services:
    get:
      tags: [Logs]
      summary: Distinct recent service names
      responses:
        '200': { description: Service names for the filter dropdown. }
  /v1/logs/levels:
    get:
      tags: [Logs]
      summary: Log volume per coarse level
      parameters:
        - { name: service, in: query, required: false, schema: { type: string } }
        - { name: hours, in: query, required: false, schema: { type: integer } }
      responses:
        '200': { description: '`[[level, count], …]` over the window (severity-volume bar).' }
  /v1/logs/export.csv:
    get:
      tags: [Logs]
      summary: Export logs as CSV
      description: >-
        Same `service` / `level` / `q` / `trace_id` filters as `/v1/logs`.
        `limit` is clamped to 50,000 rows. Returns `text/csv` as a file
        attachment. For continuous forwarding use the syslog/SIEM export sink.
      parameters:
        - { name: service,  in: query, required: false, schema: { type: string } }
        - { name: level,    in: query, required: false, schema: { type: string, enum: [trace, debug, info, warn, error, fatal] } }
        - { name: q,        in: query, required: false, schema: { type: string } }
        - { name: trace_id, in: query, required: false, schema: { type: string } }
        - { name: limit,    in: query, required: false, schema: { type: integer } }
      responses:
        '200': { description: 'CSV: ts,level,severity,service,trace_id,span_id,body,attributes.' }
  # ─────────────────────────── Profiling ───────────────────────────
  /profiles/v1/folded:
    post:
      tags: [Profiling]
      summary: Ingest a folded-stack profile
      description: >-
        Brendan-Gregg folded text (`frame;frame value` per line). Public
        (network-scoped); honors the optional telemetry token + Content-Encoding.
        Query params: service, type, period_ns, duration_ns. See
        docs/design/PROFILING.md.
      responses:
        '200': { description: 'Empty `{}` = stored.' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /profiles/v1/pprof:
    post:
      tags: [Profiling]
      summary: Ingest a pprof profile
      description: >-
        Gzipped pprof protobuf (Go runtime/pprof, the Rust pprof crate, py-spy,
        async-profiler, Pyroscope/Parca). Type defaults to the pprof sample-type
        name. Query params: service, type.
      responses:
        '200': { description: 'Empty `{}` = stored.' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /otlp/v1development/profiles:
    post:
      tags: [Profiling]
      summary: OTLP profiles ingest (v1development)
      description: >-
        Accepts an OTLP ExportProfilesServiceRequest (protobuf). One request may
        carry many profiles; each resource/scope profile is lowered to a
        flamegraph. Public, on the same /otlp surface as traces + logs.
      responses:
        '200': { description: 'Empty `{}` = stored.' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/profiles:
    get:
      tags: [Profiling]
      summary: List profiles in a window
      parameters:
        - { name: service, in: query, required: false, schema: { type: string } }
        - { name: type, in: query, required: false, schema: { type: string } }
        - { name: hours, in: query, required: false, schema: { type: integer } }
      responses:
        '200': { description: 'Profile metadata newest-first (id, received_at, service, type, sample_count, …).' }
  /v1/profiles/services:
    get:
      tags: [Profiling]
      summary: Distinct services with profiles
      responses:
        '200': { description: Service names for the picker. }
  /v1/profiles/types:
    get:
      tags: [Profiling]
      summary: Distinct profile types
      parameters:
        - { name: service, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: Profile-type names, optionally scoped to a service. }
  /v1/profiles/flamegraph:
    get:
      tags: [Profiling]
      summary: Merged flamegraph for a service+type window
      parameters:
        - { name: service, in: query, required: true, schema: { type: string } }
        - { name: type, in: query, required: true, schema: { type: string } }
        - { name: hours, in: query, required: false, schema: { type: integer } }
      responses:
        '200': { description: '`{tree, top, sample_count}` — inclusive-value flame tree + top functions.' }
  /v1/profiles/flamegraph/diff:
    get:
      tags: [Profiling]
      summary: Diff flamegraph (window vs preceding window)
      description: >-
        Compares the most-recent window of `hours` against the immediately
        preceding window of the same length. Each node carries its after value
        and the after−before delta (positive = hotter).
      parameters:
        - { name: service, in: query, required: true, schema: { type: string } }
        - { name: type, in: query, required: true, schema: { type: string } }
        - { name: hours, in: query, required: false, schema: { type: integer } }
      responses:
        '200': { description: '`{tree, after_samples, before_samples}` — diff tree (node.delta = after−before).' }
  /v1/profiles/{id}/flamegraph:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [Profiling]
      summary: Flamegraph for a single profile
      responses:
        '200': { description: '`{tree, top, sample_count}` for the one profile.' }
        '404': { description: No profile with that id. }
  # ─────────────────────────── Errors ───────────────────────────
  /v1/error-projects:
    get:
      tags: [Errors]
      summary: List error projects
      responses:
        '200': { description: Projects with DSN public key + alert channels. }
    post:
      tags: [Errors]
      summary: Create an error project
      description: >-
        Mints a DSN public key. Assemble the SDK DSN as
        `https://<public_key>@<host>/<id>`. Body: `{name, platform?,
        alert_channel_ids?}`. See docs/design/ERROR-TRACKING.md.
      responses:
        '201': { description: Created project. }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/error-projects/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Errors]
      summary: Update a project
      responses:
        '200': { description: Updated project. }
    delete:
      tags: [Errors]
      summary: Delete a project
      description: Removes the project and all its issues + events.
      responses:
        '204': { description: Deleted. }
  /v1/error-projects/{id}/issues:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: status, in: query, required: false, schema: { type: string, enum: [unresolved, resolved, ignored] } }
    get:
      tags: [Errors]
      summary: Issues for a project
      responses:
        '200': { description: Issues, newest activity first (optionally filtered by status). }
  /v1/error-projects/{id}/sourcemaps:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Errors]
      summary: List uploaded source maps
      responses:
        '200': { description: '`[{ id, release, filename, uploaded_at }]` (metadata only).' }
    post:
      tags: [Errors]
      summary: Upload a source map
      description: >-
        Store a JS source map for `(release, filename)` — used to symbolicate
        minified stack frames on read. `filename` is reduced to its basename.
        Body `{ release, filename, map }`.
      responses:
        '200': { description: '`{ id }` of the stored map.' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/error-projects/{id}/sourcemaps/{map_id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: map_id, in: path, required: true, schema: { type: integer } }
    delete:
      tags: [Errors]
      summary: Delete a source map
      responses:
        '204': { description: Deleted. }
        '404': { description: No such map for this project. }
  /v1/error-issues/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Errors]
      summary: Issue detail
      responses:
        '200': { description: 'Issue `{title, culprit, level, status, first_seen, last_seen, times_seen}`.' }
        '404': { description: No such issue. }
  /v1/error-issues/{id}/events:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Errors]
      summary: Recent events for an issue
      responses:
        '200': { description: Up to 50 events, newest first, with stacktrace + context. }
  /v1/error-issues/{id}/stats:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Errors]
      summary: Issue statistics
      responses:
        '200': { description: 'Issue stats `{users_affected, by_release[[name,count]], by_environment[[name,count]]}`.' }
        '404': { description: No such issue. }
  /v1/error-issues/{id}/resolve:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Errors]
      summary: Resolve an issue
      responses:
        '200': { description: Updated issue. }
  /v1/error-issues/{id}/ignore:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Errors]
      summary: Ignore an issue
      responses:
        '200': { description: Updated issue. }
  /v1/error-issues/{id}/unresolve:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Errors]
      summary: Unresolve an issue
      responses:
        '200': { description: Updated issue. }
  /v1/error-issues/{id}/assign:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Errors]
      summary: Assign (or unassign) an issue
      description: 'Body `{assignee}`: a user UUID, or null/empty to unassign.'
      responses:
        '200': { description: Updated issue. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: No such issue. }
  /v1/error-issues/assignable-users:
    get:
      tags: [Errors]
      summary: Assignee directory
      description: >-
        Minimal user list (id / name / email) for the assignee picker —
        editor-visible, unlike the admin `/v1/users` list.
      responses:
        '200': { description: '`[{id, name, email}]`.' }
  /api/{project_id}/envelope:
    parameters:
      - { name: project_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Errors]
      summary: Sentry-compatible envelope ingest
      description: >-
        DSN-keyed (public; via `X-Sentry-Auth` or `?sentry_key=`), not
        session-authed. Accepts gzip/deflate bodies. Parses the `event` item;
        other item types are accepted and ignored. Also served at the
        trailing-slash path `/api/{project_id}/envelope/`.
      responses:
        '200': { description: '`{ "id": "<event-id>" }`.' }
        '404': { description: Unknown project or bad DSN key. }
  /api/{project_id}/store:
    parameters:
      - { name: project_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Errors]
      summary: Sentry-compatible legacy store ingest
      description: Single-event (non-envelope) transport for older SDKs. Same auth + response as envelope. Also at `/api/{project_id}/store/`.
      responses:
        '200': { description: '`{ "id": "<event-id>" }`.' }
        '404': { description: Unknown project or bad DSN key. }
  # ─────────────────────────── RUM ───────────────────────────
  /rum/snippet.js:
    get:
      tags: [RUM]
      summary: The browser RUM collector script
      responses:
        '200': { description: 'JavaScript; install via <script src=".../rum/snippet.js" data-app="web">.' }
  /rum/v1/events:
    post:
      tags: [RUM]
      summary: RUM beacon ingest
      description: >-
        One page-view beacon `{app, url, session?, ua?, metrics:{lcp,fcp,cls,inp,ttfb,load}}`,
        sent by the snippet via sendBeacon. Public; body parsed as JSON.
        Useless beacons are dropped. See docs/design/RUM.md.
      responses:
        '204': { description: Accepted (always, even if dropped). }
  /rum/v1/errors:
    post:
      tags: [RUM]
      summary: RUM browser-error ingest
      description: >-
        One captured browser exception `{app, kind?, message, url?, stack?}`,
        sent by the snippet's window.onerror / unhandledrejection hooks. Public
        (subject to the optional shared ingest token). The server records it in
        the error-tracking tier under a project auto-named after `app`, so JS
        errors group + alert like backend SDK errors. Empty/garbled bodies are
        dropped. See docs/design/RUM.md.
      responses:
        '204': { description: Accepted (always, even if dropped). }
        '401': { description: Ingest token configured and missing/incorrect. }
  /v1/rum/summary:
    get:
      tags: [RUM]
      summary: Web Vitals p75 summary
      parameters:
        - { name: app,   in: query, required: false, schema: { type: string } }
        - { name: hours, in: query, required: false, schema: { type: integer } }
      responses:
        '200': { description: 'p75 of each metric + view count over the window.' }
  /v1/rum/pages:
    get:
      tags: [RUM]
      summary: Per-page Web Vitals
      parameters:
        - { name: app,   in: query, required: false, schema: { type: string } }
        - { name: hours, in: query, required: false, schema: { type: integer } }
      responses:
        '200': { description: 'Per-URL views + p75 LCP/INP/CLS, busiest first.' }
  /v1/rum/apps:
    get:
      tags: [RUM]
      summary: Distinct app/site names
      responses:
        '200': { description: App names for the filter dropdown. }
  # ─────────────────────────── On-call ───────────────────────────
  /v1/on-call-schedules:
    get:
      tags: [On-call]
      summary: List on-call schedules
      responses:
        '200': { description: Schedules with their rotation cadence + participant rings. }
    post:
      tags: [On-call]
      summary: Create an on-call schedule
      description: >-
        A schedule rotates notification channels (Rampart addresses by
        channel, not user). participant_ids is the rotation ring (1–50
        channels); rotation_seconds is the handoff cadence (300–31536000,
        i.e. 5 min–365 days); anchor is the UTC instant participant[0]'s
        first shift begins. "Who is on call at T" is computed as
        participant_ids[floor((T-anchor)/rotation_seconds) mod len]. An
        escalation step references a schedule by id in its schedule_ids.
        See docs/ON-CALL.md.
      responses:
        '201': { description: Created schedule. }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/on-call-schedules/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [On-call]
      summary: Update a schedule
      responses:
        '200': { description: Updated schedule. }
        '400': { $ref: '#/components/responses/BadRequest' }
    delete:
      tags: [On-call]
      summary: Delete a schedule
      description: Escalation steps referencing it resolve to nothing and are skipped at page time.
      responses:
        '204': { description: Deleted. }
  /v1/on-call-schedules/{id}/current:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [On-call]
      summary: Who is on call right now
      responses:
        '200': { description: '`{ "on_call": "<channel-uuid>" }`, or `{ "on_call": null }` for an empty ring.' }
        '404': { description: No such schedule. }

  # ─────────────────────────── Users ───────────────────────────
  /v1/users:
    get:
      tags: [Users]
      summary: List users
      description: Admin only.
      responses:
        '200':
          description: Users.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Users]
      summary: Create a user
      description: 'Admin only. `role` defaults to `editor`; legacy `is_admin: true` maps to `admin`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                name: { type: string }
                password: { type: string, minLength: 10 }
                role: { $ref: '#/components/schemas/Role' }
                is_admin: { type: boolean, description: 'Legacy. Use role instead.' }
      responses:
