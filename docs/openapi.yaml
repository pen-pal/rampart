  # ─────────────────────────── Audit ───────────────────────────
  /v1/delivery-log:
    get:
      tags: [Audit]
      summary: List notification delivery attempts
      description: >-
        Admin only. Recent per-channel notification send attempts (success and
        failure), newest first. Paginated with the `before` RFC3339 cursor.
      parameters:
        - in: query
          name: before
          required: false
          schema: { type: string, format: date-time }
          description: Return entries strictly older than this timestamp.
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200':
          description: Delivery-log entries, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DeliveryLogEntry' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/delivery-log/{id}/retry:
    post:
      tags: [Audit]
      summary: Retry a failed delivery
      description: >-
        Admin only. Re-send the notification recorded by this delivery-log
        entry through its original channel. Records a new delivery-log row for
        the retry attempt and returns it.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: The new delivery attempt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryLogEntry' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The original channel no longer exists, so it cannot be retried.
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/delivery-log/export.csv:
    get:
      tags: [Audit]
      summary: Export the delivery log as CSV
      description: Admin only. Columns - sent_at, channel_kind, event_kind, monitor_id, ok, error.
      responses:
        '200':
          description: CSV attachment.
          content:
            text/csv:
              schema: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/audit-log:
    get:
      tags: [Audit]
      summary: List audit entries
      description: Admin only. Secrets in payloads are redacted before storage.
      responses:
        '200':
          description: Audit entries.
          content:
            application/json:
              schema:
                type: array
