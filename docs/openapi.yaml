openapi: 3.1.0
info:
  title: Rampart REST API
  version: 0.3.0
  summary: Uptime monitoring, status pages, incidents, and alerting.
  description: |
    Hand-curated OpenAPI description of the **primary** Rampart REST surface.
    It is representative, not exhaustive: every resource group is covered with
    its main routes and request/response shapes, but not every query parameter
    or every one of the ~100 handlers is enumerated. The canonical contract for
    any endpoint is the Rust source in
    `backend/crates/rampart-api/src/routes/` and the types in
    `backend/crates/rampart-core/`.

    ## Authentication

    Two interchangeable credentials resolve to the same authenticated user:

    * **Session cookie** — `rampart_session`, HTTP-only, `SameSite=Strict`,
      `Secure` over HTTPS. Minted by `POST /v1/auth/login` (or `/register` on
      first run). This is what the dashboard SPA uses.
    * **API key** — `Authorization: Bearer rmp_<32 chars>`, created at
      `POST /v1/api-keys`. Equivalent to a session for all `/v1` routes.

    The public surface (`/v1/auth/*`, `/v1/public/*`, the ingest receivers,
    `/push/{token}`, and the spec + health endpoints) needs no credential.

    ## RBAC

    Three roles gate the protected `/v1` surface:

    * `admin` — everything, including the admin-only groups below.
    * `editor` — full monitoring CRUD (monitors, status pages, incidents,
      notifications, tags, folders, maintenance) but no admin surfaces.
    * `readonly` — `GET`/read only; any mutation returns `403`. Exempt:
      self-service account routes (password, 2FA, web-push).

    Each tag group below documents its role requirement.

servers:
  - url: /

tags:
  - name: Auth
    description: Login / logout / current-user. Public; rate-limited per IP.
  - name: Monitors
    description: Monitor CRUD, heartbeats, reliability, SLO, bulk ops. Editor writes; readonly reads.
  - name: Status Pages
    description: Admin CRUD (editor) plus the unauthenticated public view, by-domain lookup, unlock, and feeds.
  - name: Incidents
    description: Status-page incident posts + running updates. Editor.
  - name: Maintenance
    description: Maintenance windows + monitor attach/detach. Editor.
  - name: Notifications
    description: Notification channels + message templates. Editor.
  - name: Tags
    description: Colored monitor labels. Editor.
  - name: Folders
    description: Cosmetic monitor groups (folders). Editor.
  - name: API Keys
    description: Personal bearer keys. Admin only.
  - name: Proxies
    description: Outbound HTTP/SOCKS proxies for probes. Admin only.
  - name: Agents
    description: Remote probe agents — registration (admin), assignment list (editor reads), and the token-authed agent wire protocol.
  - name: Users
    description: User management + role assignment (admin); self-service password (any role).
  - name: Audit
    description: Append-only audit log + CSV export. Admin only.
  - name: Ingest
    description: Public inbound webhook receivers + admin-managed ingest tokens.
  - name: Health
    description: Liveness / readiness / Prometheus metrics + the OpenAPI spec. Public.

paths:
  # ─────────────────────────── Health / ops ───────────────────────────
  /healthz:
    get:
      tags: [Health]
      summary: Liveness probe
      description: Always 200 if the process can answer. Carries the build version.
      security: []
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: alive }
                  version: { type: string, example: 0.3.0 }
  /readyz:
    get:
      tags: [Health]
      summary: Readiness probe
      description: 200 only once the database is reachable (a `SELECT 1` round-trip succeeds).
      security: []
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ready }
        '503':
          description: Database unreachable.
  /metrics:
    get:
      tags: [Health]
      summary: Prometheus metrics
      description: |
        Text exposition (`text/plain; version=0.0.4`). Includes
        `rampart_build_info`, `rampart_monitors{status}`,
        `rampart_monitors_by_kind{kind}`, `rampart_channels_active`,
        `rampart_webpush_subscribers`, `rampart_heartbeats_24h{status}`,
        `rampart_incidents_open`, plus HTTP request counters / latency.
      security: []
      responses:
        '200':
          description: Prometheus exposition text.
          content:
            text/plain:
              schema: { type: string }
  /openapi.yaml:
    get:
      tags: [Health]
      summary: This spec (YAML)
      security: []
      responses:
        '200':
          description: OpenAPI 3.1 document, YAML.
          content:
            text/yaml:
              schema: { type: string }
  /openapi.json:
    get:
      tags: [Health]
      summary: This spec (JSON)
      security: []
      responses:
        '200':
          description: OpenAPI 3.1 document, JSON.
          content:
            application/json:
              schema: { type: object }

  # ─────────────────────────── Auth ───────────────────────────
  /v1/auth/register:
    post:
      tags: [Auth]
      summary: First-run signup
      description: Succeeds only when zero users exist; the new user becomes `admin`. Subsequent calls return 409. Sets the session cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterInput' }
      responses:
        '201':
          description: User created; session cookie set.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/auth/login:
    post:
      tags: [Auth]
      summary: Log in
      description: Verifies email + password. On success sets the session cookie. If the account has TOTP enabled, returns 202 with a `challenge_token` to be completed via `/v1/auth/2fa/verify`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200':
          description: Logged in; session cookie set.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '202':
          description: 2FA required.
          content:
            application/json:
              schema:
                type: object
                properties:
                  totp_required: { type: boolean, example: true }
                  challenge_token: { type: string, format: uuid }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/auth/logout:
    post:
      tags: [Auth]
      summary: Log out
      description: Deletes the session row and clears the cookie.
      responses:
        '204':
          description: Logged out.
  /v1/auth/me:
    get:
      tags: [Auth]
      summary: Current user
      description: |
        Returns `{ user }` for the logged-in caller. Special-cases first run:
        when the DB has no users at all, returns `{ needs_setup: true }` (200)
        so the SPA can route to the signup screen. Otherwise 401 when not
        authenticated.
      security: []
      responses:
        '200':
          description: The current user, or a first-run setup hint.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      user: { $ref: '#/components/schemas/User' }
                  - type: object
                    properties:
                      needs_setup: { type: boolean, example: true }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ─────────────────────────── Monitors ───────────────────────────
  /v1/monitors:
    get:
      tags: [Monitors]
      summary: List monitors
      responses:
        '200':
          description: All monitors, tags hydrated.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Monitor' }
    post:
      tags: [Monitors]
      summary: Create a monitor
      description: Editor or admin. Which of `url` / `hostname` / `port` are required depends on `kind`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewMonitor' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Monitor' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/monitors/{id}:
    parameters:
      - $ref: '#/components/parameters/MonitorId'
    get:
      tags: [Monitors]
      summary: Get a monitor
      responses:
        '200':
          description: The monitor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Monitor' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Monitors]
      summary: Update a monitor
      description: Partial update. `kind` is immutable. Editor or admin.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMonitor' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Monitor' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Monitors]
      summary: Delete a monitor
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/monitors/{id}/heartbeats:
    parameters:
      - $ref: '#/components/parameters/MonitorId'
      - name: limit
        in: query
        schema: { type: integer, default: 100, maximum: 2000 }
      - name: before
        in: query
        description: Return heartbeats strictly older than this RFC3339 timestamp (cursor).
        schema: { type: string, format: date-time }
    get:
      tags: [Monitors]
      summary: Recent heartbeats
      responses:
        '200':
          description: Heartbeats, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Heartbeat' }
  /v1/monitors/{id}/reliability:
    parameters:
      - $ref: '#/components/parameters/MonitorId'
      - name: window_days
        in: query
        description: Trailing window. Allowed 7, 30, 90. Default 30.
        schema: { type: integer, enum: [7, 30, 90], default: 30 }
    get:
      tags: [Monitors]
      summary: Reliability rollup (MTBF / MTTR)
      responses:
        '200':
          description: Reliability metrics.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reliability' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/monitors/{id}/slo/error-budget:
    parameters:
      - $ref: '#/components/parameters/MonitorId'
    get:
      tags: [Monitors]
      summary: SLO error budget
      description: 404 when the monitor has no `slo_target_pct` / `slo_window_days` configured.
      responses:
        '200':
          description: Error-budget figures for the configured window.
          content:
            application/json:
              schema: { type: object, description: 'rampart_db::heartbeats::ErrorBudget — remaining/consumed budget, allowed downtime, current uptime.' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/monitors/{id}/slo/burndown:
    parameters:
      - $ref: '#/components/parameters/MonitorId'
      - name: window_days
        in: query
        schema: { type: integer, enum: [7, 30, 90] }
    get:
      tags: [Monitors]
      summary: SLO error-budget burn-down
      description: One point per day across the window. Same 404 contract as error-budget.
      responses:
        '200':
          description: Burn-down series.
          content:
            application/json:
              schema:
                type: object
                properties:
                  window_days: { type: integer }
                  target_pct: { type: number, format: double }
                  allowed_downtime_secs: { type: integer, format: int64 }
                  points: { type: array, items: { type: object } }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/monitors/{id}/rollups:
    parameters:
      - $ref: '#/components/parameters/MonitorId'
      - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
      - { name: to, in: query, required: false, schema: { type: string, format: date-time } }
    get:
      tags: [Monitors]
      summary: Hourly heartbeat rollups
      description: >-
        Downsampled hourly buckets retained past the raw-heartbeat tier
        (default last 30 days). Same read RBAC + 404 contract as /heartbeats.
      responses:
        '200':
          description: Hourly rollup rows.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    bucket_start: { type: string, format: date-time }
                    up_count: { type: integer }
                    down_count: { type: integer }
                    other_count: { type: integer }
                    sample_count: { type: integer }
                    avg_latency_ms: { type: [number, 'null'], format: double }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/monitors/{id}/uptime-history:
    parameters:
      - $ref: '#/components/parameters/MonitorId'
      - { name: range, in: query, required: false, schema: { type: string, enum: ['30d', '90d', '1y'], default: '30d' } }
    get:
      tags: [Monitors]
      summary: Long-range daily uptime series
      description: >-
        Per-day uptime percentage over the range, stitched from raw heartbeats
        within the raw-retention tier and from hourly rollups beyond it, so the
        series extends past the raw horizon. Same read RBAC + 404 contract.
      responses:
        '200':
          description: Daily uptime points.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    day: { type: string, format: date }
                    uptime_pct: { type: number, format: double }
                    sample_count: { type: integer }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/monitors/{id}/test-notifications:
    parameters:
      - $ref: '#/components/parameters/MonitorId'
    post:
      tags: [Monitors]
      summary: Fire a test notification to every attached channel
      description: Resolves the channels for this monitor (direct + tag/folder routing) and sends a synthetic test through each. Per-channel ok/error.
      responses:
        '200':
          description: Per-channel results.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent:
                    type: array
                    items:
                      type: object
                      properties:
                        channel_id: { type: string, format: uuid }
                        ok: { type: boolean }
                        error: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/monitors/import-csv:
    post:
      tags: [Monitors]
      summary: Bulk-import monitors from CSV
      description: POST a Rampart-native CSV as the raw request body (`text/csv` / `text/plain`). Unmappable or failed rows come back in `skipped` rather than aborting the batch.
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string }
      responses:
        '200':
          description: Import outcome.
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: { type: integer }
                  skipped:
                    type: array
                    items:
                      type: object
                      properties:
                        row: { type: string }
                        reason: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/monitors/bulk-edit:
    post:
      tags: [Monitors]
      summary: Bulk-edit monitors
      description: >-
        Apply a patch to up to 500 monitors in one transaction. Each `patch`
        field is optional and omitting it leaves that attribute untouched;
        `tags` REPLACES the tag set; `group_id: null` clears the folder.
        Interval/timeout are range-checked up front via the shared validator,
        so an out-of-range value rejects the whole request. `updated` counts
        monitors mutated; `skipped` counts ids that matched no monitor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, patch]
              properties:
                ids: { type: array, items: { type: string, format: uuid } }
                patch:
                  type: object
                  properties:
                    interval_secs: { type: integer }
                    timeout_secs: { type: integer }
                    enabled: { type: boolean }
                    group_id: { type: [string, 'null'], format: uuid, description: 'null clears the folder assignment.' }
                    tags: { type: array, items: { type: string, format: uuid }, description: 'Replaces the monitor''s entire tag set.' }
      responses:
        '200':
          description: Edit outcome.
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: integer }
                  skipped: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ─────────────────────────── Status Pages ───────────────────────────
  /v1/status-pages:
    get:
      tags: [Status Pages]
      summary: List status pages (admin view)
      responses:
        '200':
          description: All status pages.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StatusPage' }
    post:
      tags: [Status Pages]
      summary: Create a status page
      description: Editor or admin. Setting `password` makes the page private.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewStatusPage' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/status-pages/{id}:
    parameters:
      - $ref: '#/components/parameters/StatusPageId'
    get:
      tags: [Status Pages]
      summary: Get a status page (admin view)
      responses:
        '200':
          description: The page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusPage' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Status Pages]
      summary: Update a status page
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateStatusPage' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusPage' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Status Pages]
      summary: Delete a status page
      responses:
        '204': { description: Deleted. }
  /v1/public/status-pages/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Status Pages]
      summary: Public status-page view
      description: Unauthenticated. Private pages return a locked stub until unlocked via the cookie set by `/unlock`.
      security: []
      responses:
        '200':
          description: Public projection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicStatusPage' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/public/status-pages/by-domain/{host}:
    parameters:
      - name: host
        in: path
        required: true
        description: Custom hostname (e.g. status.acme.com).
        schema: { type: string }
    get:
      tags: [Status Pages]
      summary: Public view resolved by custom domain
      security: []
      responses:
        '200':
          description: Public projection.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicStatusPage' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/public/status-pages/{slug}/unlock:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Status Pages]
      summary: Unlock a password-protected page
      description: Verifies the page password and sets an unlock cookie so subsequent public-view reads return full content.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        '200': { description: Unlocked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/public/status-pages/{slug}/feed.atom:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Status Pages]
      summary: Incident feed (Atom)
      security: []
      responses:
        '200':
          description: Atom feed.
          content:
            application/atom+xml:
              schema: { type: string }
  /v1/public/status-pages/{slug}/feed.rss:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Status Pages]
      summary: Incident feed (RSS)
      security: []
      responses:
        '200':
          description: RSS feed.
          content:
            application/rss+xml:
              schema: { type: string }

  # ─────────────────────────── Incidents ───────────────────────────
  /v1/status-pages/{id}/incidents:
    parameters:
      - $ref: '#/components/parameters/StatusPageId'
    get:
      tags: [Incidents]
      summary: List incidents for a page
      responses:
        '200':
          description: Incidents.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Incident' }
    post:
      tags: [Incidents]
      summary: Create an incident
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewIncident' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Incident' }
  /v1/incidents/{id}:
    parameters:
      - $ref: '#/components/parameters/IncidentId'
    patch:
      tags: [Incidents]
      summary: Update an incident
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewIncident' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Incident' }
    delete:
      tags: [Incidents]
      summary: Delete an incident
      responses:
        '204': { description: Deleted. }
  /v1/incidents/{id}/resolve:
    parameters:
      - $ref: '#/components/parameters/IncidentId'
    post:
      tags: [Incidents]
      summary: Resolve an incident
      responses:
        '200':
          description: Resolved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Incident' }
  /v1/incidents/{id}/updates:
    parameters:
      - $ref: '#/components/parameters/IncidentId'
    get:
      tags: [Incidents]
      summary: List incident updates
      responses:
        '200':
          description: Updates, oldest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/IncidentUpdate' }
    post:
      tags: [Incidents]
      summary: Post an incident update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
      responses:
        '201':
          description: Posted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentUpdate' }

  # ─────────────────────────── Maintenance ───────────────────────────
  /v1/maintenance-windows:
    get:
      tags: [Maintenance]
      summary: List maintenance windows
      responses:
        '200':
          description: Windows.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MaintenanceWindow' }
    post:
      tags: [Maintenance]
      summary: Create a maintenance window
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewMaintenanceWindow' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceWindow' }
  /v1/maintenance-windows/{id}:
    parameters:
      - $ref: '#/components/parameters/MaintenanceId'
    get:
      tags: [Maintenance]
      summary: Get a maintenance window
      responses:
        '200':
          description: The window.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceWindow' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Maintenance]
      summary: Update a maintenance window
      requestBody:
        required: true
        content:
          application/json:
