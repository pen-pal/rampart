<?xml version="1.0" encoding="UTF-8"?>
<!-- Rampart brand mark — two-tone battlemented shield with ECG pulse.
     Left half: burnt-orange outline (silhouette).
     Right half: slate fill with subtle vertical gradient (depth).
     Centre: ECG pulse — orange foreground, white halo so the line still
     reads where it crosses the dark slate. The split-at-centre composition
     evokes "two sides of the wall" while the pulse keeps the uptime-
     monitor identity. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Rampart">
  <defs>
    <linearGradient id="slateFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3b414c"/>
      <stop offset="100%" stop-color="#2c323b"/>
    </linearGradient>
  </defs>

  <!-- Right half: filled slate. Battlements: half-merlon at centre
       (x 64→70), crenel (70→79), merlon (79→91), crenel (91→100),
       merlon (100→112). Body descends to the bottom apex at 64,120. -->
  <path
    d="M 64 12
       h 6 v 8 h 9 v -8
       h 12 v 8 h 9 v -8
       h 12
       V 60
       C 112 92, 94 110, 64 120
       Z"
    fill="url(#slateFill)"
    stroke="#2a2f38"
    stroke-width="0.8"
    stroke-linejoin="round"
  />

  <!-- Left half: orange silhouette stroke. Same battlement pattern
       mirrored: half-merlon (64→58), crenel, merlon, crenel, merlon,
       then down the left edge to the shared bottom apex at 64,120. -->
  <path
    d="M 64 12
       h -6 v 8 h -9 v -8
       h -12 v 8 h -9 v -8
       h -12
       V 60
       C 16 92, 34 110, 64 120"
    fill="none"
    stroke="#d27a3c"
    stroke-width="4"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- ECG pulse — drawn twice: a wider white halo underlayer so the
       line stays legible where it crosses the dark slate half, then
       the orange foreground stroke on top. Shape is the classic QRS-T
       complex: flat → P → Q → R-peak → S → T → flat. -->
  <path
    d="M 22 68 L 44 68 L 50 56 L 56 92 L 64 36 L 72 92 L 78 56 L 84 68 L 106 68"
    fill="none"
    stroke="#ffffff"
    stroke-width="8"
    stroke-linejoin="round"
    stroke-linecap="round"
  />
  <path
    d="M 22 68 L 44 68 L 50 56 L 56 92 L 64 36 L 72 92 L 78 56 L 84 68 L 106 68"
    fill="none"
    stroke="#d27a3c"
    stroke-width="4"
    stroke-linejoin="round"
    stroke-linecap="round"
  />
</svg>
