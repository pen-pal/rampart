<?xml version="1.0" encoding="UTF-8"?>
<!-- Rampart wordmark — shield silhouette evoking the "rampart" defensive
     wall, with a stylised "R" cut into the negative space. Accent colour
     #14b8a6 matches the app's --accent CSS variable so the README hero
     reads as the same brand as the dashboard screenshot below it. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Rampart">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <!-- shield -->
  <path d="M48 4 L86 16 V44 C86 66 70 84 48 92 C26 84 10 66 10 44 V16 Z"
        fill="url(#bg)" stroke="#0f766e" stroke-width="2" stroke-linejoin="round"/>
  <!-- crenellation across the top -->
  <path d="M16 18 H22 V14 H30 V18 H36 V14 H44 V18 H52 V14 H60 V18 H66 V14 H74 V18 H80 V24 H16 Z"
        fill="#0f766e"/>
  <!-- "R" mark -->
  <path d="M34 36 H54 a10 10 0 0 1 0 20 H46 L58 76 H50 L40 58 H42 V76 H34 Z M42 44 V50 H52 a3 3 0 0 0 0 -6 Z"
        fill="#ffffff"/>
</svg>
