<?xml version="1.0" encoding="UTF-8"?>
<!-- Rampart wordmark = brand mark + "RAMPART" wordtype.
     Drop-in for the README hero block and GitHub social preview slot
     (1280×640 crops cleanly off 480×144 at 3:1). Same mark as logo.svg
     translated into the left third; wordtype sits to its right in a
     heavy geometric sans on the system font stack (no webfont fetch,
     no licence question). -->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 480 144"
     width="480" height="144"
     role="img"
     aria-label="Rampart — self-hosted uptime monitor">
  <defs>
    <linearGradient id="slateFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3b414c"/>
      <stop offset="100%" stop-color="#2c323b"/>
    </linearGradient>
  </defs>

  <!-- ─── Brand mark (translated copy of logo.svg) ─────────────────────── -->
  <g transform="translate(8 8)">
    <path
      d="M 64 12 h 6 v 8 h 9 v -8 h 12 v 8 h 9 v -8 h 12 V 60
         C 112 92, 94 110, 64 120 Z"
      fill="url(#slateFill)" stroke="#2a2f38" stroke-width="0.8"
      stroke-linejoin="round"
    />
    <path
      d="M 64 12 h -6 v 8 h -9 v -8 h -12 v 8 h -9 v -8 h -12 V 60
         C 16 92, 34 110, 64 120"
      fill="none" stroke="#d27a3c" stroke-width="4"
      stroke-linejoin="round" stroke-linecap="round"
    />
    <path
      d="M 22 68 L 44 68 L 50 56 L 56 92 L 64 36 L 72 92 L 78 56 L 84 68 L 106 68"
      fill="none" stroke="#ffffff" stroke-width="8"
      stroke-linejoin="round" stroke-linecap="round"
    />
    <path
      d="M 22 68 L 44 68 L 50 56 L 56 92 L 64 36 L 72 92 L 78 56 L 84 68 L 106 68"
      fill="none" stroke="#d27a3c" stroke-width="4"
      stroke-linejoin="round" stroke-linecap="round"
    />
  </g>

  <!-- ─── Wordtype ────────────────────────────────────────────────────── -->
  <!-- All-caps RAMPART set in slate to match the right-half shield fill,
       weight 800 so it carries the visual mass of the mark beside it. -->
  <text x="158" y="92"
        font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif"
        font-weight="800"
        font-size="62"
        letter-spacing="2"
        fill="#2c323b">RAMPART</text>
</svg>
