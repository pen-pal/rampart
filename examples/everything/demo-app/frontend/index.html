<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Rampart · everything demo</title>
  <!-- RUM: load Rampart's snippet SAME-ORIGIN (nginx proxies /rum/* → rampart).
       The snippet derives its beacon endpoint from its own origin, so this works
       both from a host browser (origin localhost:8088) AND from the in-network
       rum-driver (origin demo-frontend) — a hard-coded http://localhost:3000
       would only resolve from the host. It reports Core Web Vitals + browser JS
       errors (app = demo-frontend); auto-provisions an error project by app name. -->
  <script src="/rum/snippet.js" data-app="demo-frontend"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; color: #1c1917; }
    pre { background: #f5f5f4; padding: 12px; border-radius: 8px; max-height: 320px; overflow: auto; font-size: 12px; }
    button { padding: 8px 12px; margin: 4px; border-radius: 8px; border: 1px solid #ddd; cursor: pointer; background: #fff; }
    button:hover { background: #f5f5f4; }
    .row { margin: 12px 0; }
    h1 { font-size: 22px; }
    .muted { color: #78716c; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Rampart · everything demo app</h1>
  <p>This page drives the instrumented backend continuously. Open Rampart to
     watch <b>traces</b>, <b>logs</b>, <b>RUM</b>, <b>profiling</b>, <b>errors</b>
     and SIEM <b>detection</b> fill with real data.</p>
  <div class="row">
    <button onclick="hit('/api/products')">List products</button>
    <button onclick="hit('/api/products/2')">Get product (cache)</button>
    <button onclick="post('/api/checkout', {productId: 2})">Checkout</button>
    <button onclick="post('/api/login', {user: 'alice'})">Login</button>
    <button onclick="hit('/api/boom')">Trigger 500 (Sentry)</button>
    <button onclick="clientError()">Trigger client error (RUM)</button>
  </div>
  <div class="row">
    <button onclick="post('/admin/health', {down: true})">Flip backend DOWN</button>
    <button onclick="post('/admin/health', {down: false})">Flip backend UP</button>
    <span class="muted">→ flips the <code>/api/ready</code> probe target Rampart monitors.</span>
  </div>
  <pre id="out">driving traffic automatically…</pre>

  <script>
    const out = document.getElementById('out');
    const print = (m) => { out.textContent = (m + '\n' + out.textContent).slice(0, 4000); };
    async function hit(path) {
      try { const r = await fetch(path); print(`${r.status} GET ${path}`); }
      catch (e) { print(`ERR GET ${path}: ${e.message}`); }
    }
    async function post(path, body) {
      try {
        const r = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
        print(`${r.status} POST ${path}`);
      } catch (e) { print(`ERR POST ${path}: ${e.message}`); }
    }
    function clientError() { undefined.boom(); } // uncaught → RUM error capture

    // Auto-drive so there's always live telemetry.
    const users = ['alice', 'bob', 'carol', 'dave'];
    setInterval(() => hit('/api/products'), 4000);
    setInterval(() => hit('/api/products/' + (1 + Math.floor(Math.random() * 4))), 5000);
    setInterval(() => post('/api/checkout', { productId: 1 + Math.floor(Math.random() * 4) }), 7000);
    setInterval(() => post('/api/login', { user: users[Math.floor(Math.random() * users.length)] }), 6000);
    setInterval(() => hit('/api/boom'), 23000);          // occasional backend 500 → Sentry
    setInterval(() => clientError(), 31000);             // occasional UNCAUGHT client error → RUM error capture
  </script>
</body>
</html>
