server {
  listen 80;
  server_name _;

  # API + app endpoints go to the instrumented backend (same origin → no CORS).
  location /api/   { proxy_pass http://demo-backend:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
  location /admin/ { proxy_pass http://demo-backend:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }

  # RUM snippet + beacons proxied to rampart so the snippet works same-origin —
  # web vitals + JS errors reach rampart whether the page is opened from the host
  # (origin localhost:8088) or driven in-network by the rum-driver (origin
  # demo-frontend). A hard-coded http://localhost:3000 would only resolve on the
  # host. proxy_pass without a path keeps the /rum/ prefix intact.
  location /rum/   { proxy_pass http://rampart:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }

  # WebSocket endpoint (demo backend serves ws:// on :8080) — proxied so a
  # browser on the demo page could open a live socket too.
  location /ws     { proxy_pass http://demo-backend:8080; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
