# Minimal tinyproxy config for the `edge · via proxy` demo monitor.
# Rampart routes an http monitor through proxy.demo.local:3128 → this forwards
# the request to the target (target-healthy) and returns the response, so the
# monitor reports Up with a real proxied check.
Port 3128
Listen 0.0.0.0
Timeout 600
# Allow the whole docker bridge network to use the proxy (in-network only).
Allow 0.0.0.0/0
# Forwarded requests need no upstream; tinyproxy fetches the target directly.
MaxClients 50
StartServers 2
LogLevel Info
