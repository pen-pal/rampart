global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Rampart's own Prometheus exposition: build info, monitors by status,
  # alerting-pipeline gauges, ingest volume, per-table storage bytes.
  - job_name: rampart
    metrics_path: /metrics
    static_configs:
      - targets: ["rampart:3000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
