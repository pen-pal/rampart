[package]
name         = "rampart-api"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }

[lib]
name = "rampart_api"
path = "src/lib.rs"

[[bin]]
name = "rampart-api"
path = "src/main.rs"

[[bin]]
# One-shot importer CLI — reads a JSON / CSV export from another
# self-hosted dashboard and inserts mapped monitors via
# `rampart_db::monitors::create`. See `docs/IMPORTERS.md`.
name = "rampart-import"
path = "src/bin/import.rs"

[dependencies]
rampart-core      = { path = "../rampart-core" }
rampart-db        = { path = "../rampart-db" }
rampart-checker   = { path = "../rampart-checker" }
rampart-scheduler = { path = "../rampart-scheduler" }
rampart-notifier  = { path = "../rampart-notifier" }
rampart-ssrf      = { path = "../rampart-ssrf" }

axum               = { workspace = true }
axum-extra         = { workspace = true }
sqlx               = { workspace = true }
tokio              = { workspace = true }
argon2             = { workspace = true }
rand               = { workspace = true }
tower              = { workspace = true }
tower-http         = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
csv                = { workspace = true }
opentelemetry-proto = { workspace = true }
prost              = "0.13"  # match opentelemetry-proto (its Message trait)
hex                = { workspace = true }
flate2             = { workspace = true }
snap               = { workspace = true }
sourcemap          = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry      = { workspace = true }
opentelemetry_sdk  = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry-appender-tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
thiserror          = { workspace = true }
anyhow             = { workspace = true }
uuid               = { workspace = true }
time               = { workspace = true }
validator          = { workspace = true }
rust-embed         = { workspace = true }
mime_guess         = "2"
totp-rs            = { workspace = true }
base32             = { workspace = true }
base64             = { workspace = true }
sha2               = { workspace = true }
# OIDC id_token signature verification (JWKS). `rust_crypto` selects the
# pure-Rust CryptoProvider backend (RSA/EC/EdDSA) so `DecodingKey::from_jwk` +
# `decode` actually verify at runtime — the bare `jsonwebtoken = "10"` workspace
# dep ships no crypto backend and would panic on first verify. Pure-Rust to keep
# the no-C-linkage stance; the feature is additive across the workspace.
jsonwebtoken       = { workspace = true, features = ["rust_crypto"] }
reqwest            = { workspace = true }
lettre             = { workspace = true }
futures            = { workspace = true }
# Needed by `main.rs` to install ring as the global rustls
# CryptoProvider — reqwest 0.13's `rustls-no-provider` feature
# leaves the choice to the consuming binary so the whole workspace
# shares one crypto stack.
rustls             = { workspace = true }
tokio-stream       = { version = "0.1", features = ["sync"] }

[dev-dependencies]
tower = { workspace = true }
http-body-util = "0.1"
serde_json     = { workspace = true }
