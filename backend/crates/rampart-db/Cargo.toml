[package]
name         = "rampart-db"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }

[features]
# Re-export rampart-core::testing so integration tests in this crate's
# tests/ folder can build fixtures without depending on rampart-core
# directly with its `testing` feature toggled.
testing = ["rampart-core/testing"]
# Multi-DB P1: the SQLite backend (single-binary/homelab tier). Off by default
# — Postgres stays the reference build. SQLite-specific code + its compile-checked
# queries live behind this flag so the default PG build + `.sqlx` cache are
# untouched; the SQLite `.sqlx` cache is generated by a separate
# `cargo sqlx prepare --features sqlite` run against a SQLite DB.
sqlite = []

[dependencies]
rampart-core = { path = "../rampart-core" }
async-trait = { workspace = true }
sqlx        = { workspace = true }
tokio       = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
time        = { workspace = true }
tracing     = { workspace = true }
uuid        = { workspace = true }
rand        = { workspace = true }
sha2        = { workspace = true }
hex         = { workspace = true }
argon2      = { workspace = true }
aes-gcm     = { workspace = true }
base64      = { workspace = true }
once_cell   = { workspace = true }
hmac        = { workspace = true }

[dev-dependencies]
rampart-core = { path = "../rampart-core", features = ["testing"] }
tokio        = { workspace = true, features = ["macros", "rt-multi-thread"] }
