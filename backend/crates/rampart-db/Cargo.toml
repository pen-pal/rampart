[package]
name         = "rampart-db"
version      = "0.1.0"
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }

[features]
# Re-export rampart-core::testing so integration tests in this crate's
# tests/ folder can build fixtures without depending on rampart-core
# directly with its `testing` feature toggled.
testing = ["rampart-core/testing"]

[dependencies]
rampart-core = { path = "../rampart-core" }
sqlx        = { workspace = true }
tokio       = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
time        = { workspace = true }
tracing     = { workspace = true }
uuid        = { workspace = true }
rand        = { workspace = true }

[dev-dependencies]
rampart-core = { path = "../rampart-core", features = ["testing"] }
tokio        = { workspace = true, features = ["macros", "rt-multi-thread"] }
