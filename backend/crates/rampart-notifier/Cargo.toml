[package]
name         = "rampart-notifier"
version      = { workspace = true }
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }

[dependencies]
rampart-core = { path = "../rampart-core" }
rampart-db   = { path = "../rampart-db" }

tokio       = { workspace = true }
async-trait = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
reqwest     = { workspace = true }
lettre      = { workspace = true }
tracing     = { workspace = true }
thiserror   = { workspace = true }
anyhow      = { workspace = true }
time        = { workspace = true }
uuid        = { workspace = true }
liquid      = { workspace = true }
once_cell   = { workspace = true }
hmac        = { workspace = true }
sha2        = { workspace = true }
sha1        = { workspace = true }
base64      = { workspace = true }
rand        = { workspace = true }
hex         = { workspace = true }
urlencoding  = { workspace = true }
jsonwebtoken = { workspace = true }
p256         = { workspace = true }
hkdf         = { workspace = true }
aes-gcm      = { workspace = true }
# generic-array 0.14.9+ marks the slice-accessor API used by
# webpush_crypto.rs as deprecated, which CI converts to a hard error
# via `-D warnings`. Pin to the last pre-deprecation patch until the
# RustCrypto stack moves to generic-array 1.x (see docs/DEPENDENCIES.md).
# This must be a direct dep — declaring it only in `[workspace.
# dependencies]` doesn't constrain resolution, but a direct `=` dep
# does, so `cargo update` can't silently re-bump it.
generic-array = "=0.14.7"

[dev-dependencies]
rampart-core = { path = "../rampart-core", features = ["testing"] }
