# cargo-deny configuration. https://embarkstudios.github.io/cargo-deny/
# Lives next to the workspace Cargo.toml so cargo-deny finds it by default.
# Run locally: cargo install cargo-deny && (cd backend && cargo deny check)

[advisories]
# Fail on any crate with an active RUSTSEC advisory. `unmaintained` is
# noisy for transitive deps, so scope it to crates we directly depend on.
version = 2
yanked = "deny"
unmaintained = "workspace"

# Accepted-with-justification advisories. Each is a TRANSITIVE dependency
# whose fix requires a major upgrade of an intermediate crate (and, for
# rsa, has no upstream fix at all). These are tracked for a dedicated
# dependency-upgrade pass — see docs/SECURITY-DEBT.md. Review on every
# `cargo update`.
ignore = [
    # Accepted with justification. Full reasoning + fix paths in
    # docs/SECURITY-DEBT.md; re-check on every `cargo update` (last 2026-11-16).
    #
    # rustls-webpki 0.101 (via tiberius -> rustls 0.21, MSSQL probe) and 0.102
    # (via rumqttc 0.25, MQTT probe). tiberius 0.12.3 has no rustls-0.23 release
    # and 0.13 dropped rustls for native-tls (OpenSSL) -> blocked. rumqttc uses
    # webpki 0.102 only for an error-enum variant; its TLS verification runs on
    # rustls 0.23 / webpki 0.103 (patched), so the 0.102 entries are unreachable.
    # The MSSQL probe defaults to `trust_cert: true` (no chain verification).
    "RUSTSEC-2026-0049", # webpki: CRLs not authoritative by distributionPoint
    "RUSTSEC-2026-0098", # webpki: URI name constraints accepted
    "RUSTSEC-2026-0099", # webpki: name constraints on wildcard certs
    "RUSTSEC-2026-0104", # webpki: reachable panic in CRL parsing
    "RUSTSEC-2026-0382", # webpki: distrusted emSign intermediates accepted
    # rustls 0.21 (via tiberius only). No custom ClientSessionStore exists, so
    # session secrets are never Debug-formatted (0346); 0.21 has no post-quantum
    # key exchange, so there is nothing to downgrade from (0349).
    "RUSTSEC-2026-0346", # rustls: Debug impls of client session values
    "RUSTSEC-2026-0349", # rustls: unauthenticated ServerHello KX downgrade
    # crypto-bigint 0.5 via elliptic-curve 0.13 (p256: Web Push VAPID signing;
    # p256/p384 via jsonwebtoken: OIDC ES* verification). Fix = p256 0.14 +
    # jsonwebtoken 12 (major bumps of crypto paths) -> tracked follow-up.
    "RUSTSEC-2026-0387", # crypto-bigint: non-constant-time operations
    # rsa 0.9 via jsonwebtoken `rust_crypto`: OIDC RS*/PS* verification (public
    # key only) and GCP Pub/Sub RS256 service-account JWT signing (private key,
    # at most once per cached token, no attacker-triggered signing oracle).
    "RUSTSEC-2023-0071", # rsa: Marvin timing side channel
    # libsqlite3-sys 0.37 (bundled SQLite < 3.54) via sqlx-sqlite 0.9.0, which
    # caps it at <0.38. Needs a crafted database + -wal file pair that Rampart
    # opens; the SQLite path is operator-controlled (DATABASE_URL).
    "RUSTSEC-2026-0459", # libsqlite3-sys: uninit page-cache read
]

[licenses]
version = 2
# Rampart is AGPL-3.0. Inbound deps must be under permissive or weak-copyleft
# licenses we can legally combine with AGPL. Strong-copyleft GPL deps would
# be fine for us specifically, but we keep the allow-list conservative so a
# surprising transitive dep gets a human look.
allow = [
    # Rampart's own workspace crates are AGPL-3.0.
    "AGPL-3.0-or-later",
    "AGPL-3.0",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    # Boost Software License 1.0 — permissive, OSI-approved, FSF Free/Libre,
    # SPDX-listed as GPL-compatible. Pulled in via `xxhash-rust` (transitive
    # of `redis` ≥ 1.0).
    "BSL-1.0",
]
confidence-threshold = 0.9

[bans]
# Warn on duplicate versions of the same crate (bloats the binary), but
# don't hard-fail — transitive version skew is common and often unavoidable.
multiple-versions = "warn"
# The only wildcard deps in this tree are the intra-workspace rampart-*
# path crates (version "*", normal for an unpublished app). allow-wildcard-
# paths doesn't apply to crates that look publishable, so we warn rather
# than fail — there are no registry "*" deps to catch.
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
