# cargo-deny configuration. https://embarkstudios.github.io/cargo-deny/
# Lives next to the workspace Cargo.toml so cargo-deny finds it by default.
# Run locally: cargo install cargo-deny && (cd backend && cargo deny check)

[advisories]
# Fail on any crate with an active RUSTSEC advisory. `unmaintained` is
# noisy for transitive deps, so scope it to crates we directly depend on.
version = 2
yanked = "deny"
unmaintained = "workspace"

# Accepted-with-justification advisories. Each is a TRANSITIVE dependency
# whose fix requires a major upgrade of an intermediate crate (and, for
# rsa, has no upstream fix at all). These are tracked for a dedicated
# dependency-upgrade pass — see docs/SECURITY-DEBT.md. Review on every
# `cargo update`.
ignore = [
    # rustls-webpki 0.102/0.101 cert name-constraint + CRL-parse panics, pulled
    # transitively by rumqttc -> rustls 0.22, async-nats 0.36 (0.102), and
    # tiberius -> rustls 0.21 (0.101). Fix needs rustls 0.23 (webpki 0.103);
    # blocked because rumqttc 0.25 pulls aws-lc-rs/cmake (breaks the pure-Rust
    # build) and async-nats/tiberius have no semver-compatible fixed release.
    # Only reachable on a TLS handshake to an operator-specified MQTT/NATS/MSSQL
    # target with a malicious cert; CRL path not exercised by default config.
    # See docs/SECURITY-DEBT.md. Re-check on every probe-dep bump.
    "RUSTSEC-2026-0049",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0104",
]

[licenses]
version = 2
# Rampart is AGPL-3.0. Inbound deps must be under permissive or weak-copyleft
# licenses we can legally combine with AGPL. Strong-copyleft GPL deps would
# be fine for us specifically, but we keep the allow-list conservative so a
# surprising transitive dep gets a human look.
allow = [
    # Rampart's own workspace crates are AGPL-3.0.
    "AGPL-3.0-or-later",
    "AGPL-3.0",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    # Boost Software License 1.0 — permissive, OSI-approved, FSF Free/Libre,
    # SPDX-listed as GPL-compatible. Pulled in via `xxhash-rust` (transitive
    # of `redis` ≥ 1.0).
    "BSL-1.0",
]
confidence-threshold = 0.9

[bans]
# Warn on duplicate versions of the same crate (bloats the binary), but
# don't hard-fail — transitive version skew is common and often unavoidable.
multiple-versions = "warn"
# The only wildcard deps in this tree are the intra-workspace rampart-*
# path crates (version "*", normal for an unpublished app). allow-wildcard-
# paths doesn't apply to crates that look publishable, so we warn rather
# than fail — there are no registry "*" deps to catch.
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
