# Rampart · Rust workspace
#
# Crates:
#   rampart-core      — domain types, errors, IDs. No I/O.
#   rampart-db        — sqlx-backed repository layer over Postgres.
#   rampart-checker   — probe runners (HTTP today; TCP/DNS/browser later).
#   rampart-api       — axum HTTP server, the main bin.
#
# Run locally:
#   cp .env.example .env && docker compose up -d postgres
#   cargo run -p rampart-api
#
# Workspace dependencies are declared once below; member crates inherit via
# `dep = { workspace = true }`. This keeps versions aligned.

[workspace]
resolver = "2"
members  = [
  "crates/rampart-core",
  "crates/rampart-db",
  "crates/rampart-checker",
  "crates/rampart-scheduler",
  "crates/rampart-notifier",
  "crates/rampart-api",
]

[workspace.package]
edition      = "2021"
rust-version = "1.78"
license      = "AGPL-3.0-or-later"
repository   = "https://github.com/rampart-io/rampart"

[workspace.dependencies]
# async runtime
tokio = { version = "1.40", features = ["full"] }

# web
axum       = { version = "0.7", features = ["macros", "http2", "tracing"] }
axum-extra = { version = "0.9", features = ["cookie", "typed-header"] }
tower      = { version = "0.5", features = ["util", "timeout", "limit"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "timeout", "request-id"] }
hyper      = { version = "1.4", features = ["full"] }

# database
sqlx = { version = "0.8", features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "uuid",
  "time",
  "json",
  "macros",
  "migrate",
  "ipnetwork",
] }

# serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# observability
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# errors
thiserror = "1"
anyhow    = "1"

# identity / time
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }
time = { version = "0.3", features = ["serde", "macros", "formatting"] }

# http client (for probe runners + outbound notifications)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "stream"] }

# SMTP for the email notification channel
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }

# misc
async-trait = "0.1"
validator   = { version = "0.18", features = ["derive"] }
argon2      = "0.5"
rand        = "0.8"
url         = "2.5"
once_cell   = "1.19"
futures     = "0.3"

# embedded frontend bundle — debug builds read from disk, release builds embed
rust-embed  = { version = "8", features = ["mime-guess"] }

# probe-specific crates
# DNS resolver for the `dns` monitor kind. Pure-rust, async, supports
# every record type the audience cares about (A/AAAA/CNAME/MX/TXT/NS/SRV/CAA/SOA).
hickory-resolver = { version = "0.24", default-features = false, features = ["tokio-runtime", "system-config"] }
# ICMP echo for the `ping` monitor kind. Userland — needs CAP_NET_RAW or
# unprivileged ICMP sockets (Linux: net.ipv4.ping_group_range; macOS: built-in).
surge-ping       = { version = "0.8" }
# TLS handshake + cert inspection for the `tls` monitor kind.
tokio-rustls     = { version = "0.26", default-features = false, features = ["ring"] }
rustls           = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile   = "2"
webpki-roots     = "0.26"
x509-parser      = "0.16"

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = true
opt-level     = 3
panic         = "abort"

[profile.dev]
opt-level = 1     # sqlx + axum are slow in opt-level 0
