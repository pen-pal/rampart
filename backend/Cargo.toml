# Rampart · Rust workspace
#
# Crates:
#   rampart-core      — domain types, errors, IDs. No I/O.
#   rampart-db        — sqlx-backed repository layer over Postgres.
#   rampart-checker   — probe runners (HTTP today; TCP/DNS/browser later).
#   rampart-api       — axum HTTP server, the main bin.
#
# Run locally:
#   cp .env.example .env && docker compose up -d postgres
#   cargo run -p rampart-api
#
# Workspace dependencies are declared once below; member crates inherit via
# `dep = { workspace = true }`. This keeps versions aligned.

[workspace]
resolver = "2"
members  = [
  "crates/rampart-core",
  "crates/rampart-ssrf",
  "crates/rampart-db",
  "crates/rampart-checker",
  "crates/rampart-scheduler",
  "crates/rampart-notifier",
  "crates/rampart-api",
  "crates/rampart-agent",
]

[workspace.package]
# Single source of truth for the workspace version. Member crates inherit
# via `version.workspace = true` so a release is "bump this one line, commit,
# tag". The same value reaches the running binary through
# env!("CARGO_PKG_VERSION") in `rampart-api` and surfaces on `/healthz` +
# `/metrics`; the dashboard reads it from `/healthz` for the header pill.
version      = "0.157.26"
edition      = "2021"
# MSRV is forced up by transitive deps (time 0.3.47, base64ct, etc. need
# edition2024 / rustc 1.88). Newer compilers work fine; the release
# Dockerfile builds with a fresher stable (`rust:1.96-slim-bookworm`)
# for perf + diagnostic improvements without touching the MSRV floor.
rust-version = "1.88"
license      = "AGPL-3.0-or-later"
repository   = "https://github.com/pen-pal/rampart"

[workspace.dependencies]
# async runtime
tokio = { version = "1.40", features = ["full"] }

# web
axum       = { version = "0.8", features = ["macros", "http2", "tracing"] }
axum-extra = { version = "0.12", features = ["cookie", "typed-header"] }
tower      = { version = "0.5", features = ["util", "timeout", "limit"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "timeout", "request-id", "limit", "set-header"] }
hyper      = { version = "1.4", features = ["full"] }

# database
# `mysql` is here (not in rampart-db) so the `mysql` probe can use the
# same sqlx instance. Cargo unifies features so this also lands in
# rampart-db's tree, which is a small compile-time cost we eat to keep
# from juggling two sqlx instances.
sqlx = { version = "0.9", features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "mysql",
  "sqlite",
  "uuid",
  "time",
  "json",
  "macros",
  "migrate",
  "ipnetwork",
] }

# serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
# Generic CSV bulk-import format (`rampart-import csv`). Pure-Rust, no
# C deps (no aws-lc-rs / openssl / cmake) — safe to add to the tree.
csv        = "1"

# observability
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# errors
thiserror = "2"
anyhow    = "1"

# identity / time
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }
time = { version = "0.3", features = ["serde", "serde-well-known", "macros", "formatting"] }

# http client (for probe runners + outbound notifications).
# reqwest 0.13's `rustls` feature force-enables `aws-lc-rs`. The
# `rustls-no-provider` escape hatch links rustls without picking a
# crypto provider — `main.rs` installs `rustls::crypto::ring` as
# the default provider at startup so all rustls callers (this dep,
# `tokio-rustls`, `hyper-rustls`) resolve to ring. `form` + `query`
# are now per-method features (were always-on in 0.12).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "webpki-roots", "json", "gzip", "stream", "form", "query"] }

# SMTP for the email notification channel
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }

# misc
# gzip/deflate decode for Sentry-compatible error ingest (SDKs gzip envelopes
# by default). Pure-Rust miniz_oxide backend — no C toolchain (DEPENDENCIES.md).
flate2      = { version = "1", default-features = false, features = ["rust_backend"] }
# Snappy (block format) for Prometheus remote_write ingest. Pure-Rust.
snap        = "1"
sourcemap   = "9"
async-trait = "0.1"
validator   = { version = "0.20", features = ["derive"] }
argon2      = "0.5"
rand        = "0.8"
url         = "2.5"
once_cell   = "1.19"
regex       = "1.10"
sha2        = "0.10"
hex         = "0.4"
# TOTP — RFC 6238. `otpauth` feature builds the URI for the QR enrolment.
totp-rs     = { version = "5.6", features = ["otpauth"] }
base32      = "0.5"
futures     = "0.3"

# embedded frontend bundle — debug builds read from disk, release builds embed
rust-embed  = { version = "8", features = ["mime-guess"] }

# probe-specific crates
# DNS resolver for the `dns` monitor kind. Pure-rust, async, supports
# every record type the audience cares about (A/AAAA/CNAME/MX/TXT/NS/SRV/CAA/SOA).
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config"] }
# ICMP echo for the `ping` monitor kind. Userland — needs CAP_NET_RAW or
# unprivileged ICMP sockets (Linux: net.ipv4.ping_group_range; macOS: built-in).
surge-ping       = { version = "0.8" }
# TLS handshake + cert inspection for the `tls` monitor kind.
tokio-rustls     = { version = "0.26", default-features = false, features = ["ring"] }
rustls           = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile   = "2"
webpki-roots     = "1"
x509-parser      = "0.18"
# MSSQL driver — pure-rust, async, needs tokio-util's compat shim because
# tiberius is written against `futures-io` not `tokio::io`.
tiberius         = { version = "0.12", default-features = false, features = ["tds73", "chrono", "rustls"] }
tokio-util       = { version = "0.7", features = ["compat"] }
# Redis + MongoDB drivers for the remaining DB probes.
redis            = { version = "1", default-features = false, features = ["tokio-rustls-comp", "tls-rustls-webpki-roots"] }
mongodb          = "3"
# gRPC + MQTT probe deps
# tonic 0.14 reshuffled the feature set:
#   - `prost` is no longer a named feature (always present via the
#     codegen path that the probe uses)
#   - TLS support was split out — `tls-ring` selects the ring-backed
#     rustls transport, `tls-webpki-roots` ships the trust anchors
#     so `grpcs://` URIs reach the server without an explicit config
# Defaults are off to keep the dep graph minimal; the four features
# below are what the gRPC health probe actually exercises.
tonic            = { version = "0.14", default-features = false, features = ["transport", "codegen", "tls-ring", "tls-webpki-roots"] }
tonic-health     = "0.14"
prost            = "0.14"
# OTLP protobuf message types (trace ingest). Pure-Rust (prost); no C.
opentelemetry-proto = { version = "0.30", default-features = false, features = ["gen-tonic-messages", "trace", "logs"] }
# Self-observability: Rampart exports its OWN traces + logs via OTLP/HTTP when
# RAMPART_OTLP_ENDPOINT is set (dogfood; in the example it points at itself).
# HTTP+reqwest exporter (not grpc/tonic) keeps the tree pure-Rust + ring-only.
opentelemetry      = "0.30"
opentelemetry_sdk  = { version = "0.30", features = ["rt-tokio"] }
# reqwest-BLOCKING client (not async): opentelemetry_sdk 0.30's batch processor
# runs on a dedicated OS thread with no Tokio reactor, so an async client panics
# ("no reactor running"). The blocking client owns its own runtime internally.
opentelemetry-otlp = { version = "0.30", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "logs"] }
opentelemetry-appender-tracing = "0.30"
tracing-opentelemetry = "0.31"
rumqttc          = { version = "0.24", default-features = false, features = ["use-rustls"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
# NATS client. `server_2_10` enables the modern protocol surface; we
# rely only on the basic connect + flush handshake, but the upstream
# feature gates the protocol version on a flag so we enable it
# explicitly. No TLS feature — the probe accepts plaintext `nats://`
# URIs only today; TLS-via-`tls://` is a follow-up.
# `ring` selects the pure-Rust crypto provider through tokio-rustls;
# the alternate `aws-lc-rs` feature contradicts the workspace's no-C-
# crypto stance (see docs/DEPENDENCIES.md). `server_2_10` enables the
# modern protocol surface.
async-nats       = { version = "0.36", default-features = false, features = ["server_2_10", "ring"] }
# LDAP client. Pure-Rust. ldap3 0.12 splits TLS crypto-provider
# selection into per-backend features — `tls-rustls-ring` matches
# the rest of the workspace; `tls-rustls-aws-lc-rs` is the alternate
# we reject (C crypto, see docs/DEPENDENCIES.md). `sync` left off
# since the tokio async surface is what the probe uses.
ldap3            = { version = "0.12", default-features = false, features = ["tls-rustls-ring"] }
# AMQP 0-9-1 client (RabbitMQ et al). Pure-Rust. `default-features
# off` cuts the native-tls + aws-lc-rs paths (lapin's default `rustls`
# feature pulls `rustls-native-certs` + `rustls--aws_lc_rs`, neither of
# which fits the workspace's pure-Rust / ring crypto stance — see
# docs/DEPENDENCIES.md). Instead we hand-pick:
#   * `rustls--ring`             — ring-backed crypto provider, matches
#                                  the workspace-shared CryptoProvider
#                                  installed in `rampart_api::main`.
#   * `rustls-webpki-roots-certs` — Mozilla webpki trust anchors, matches
#                                  the rest of the workspace's TLS path.
# Together these enable `amqps://` for the AMQP probe without dragging
# `aws-lc-rs` / `cmake` / `openssl` into the build graph.
lapin            = { version = "3", default-features = false, features = ["rustls--ring", "rustls-webpki-roots-certs"] }
# SNMP v1/v2c client. Pure-Rust, tokio-async, no C deps.
csnmp            = "0.4"
# Cassandra / ScyllaDB driver. Pure-Rust, tokio-async. default-features
# off because the default feature set drags in `openssl` for TLS; the
# probe handles plaintext CQL only.
#
# NB: enabling scylla's `rustls-023` feature was attempted (intended to
# wire `cassandras://`-style TLS through the workspace's ring stack) but
# the crate declares both `rustls = "0.23"` and `tokio-rustls = "0.26"`
# as plain optional dependencies without `default-features = false`.
# rustls 0.23's default feature set includes `aws_lc_rs`, which Cargo's
# feature unification activates on the workspace's shared `rustls v0.23`
# — dragging `aws-lc-rs` + `cmake` into the build graph against the
# no-C-crypto invariant. Re-verified 2026-06-09 against scylla 1.6.0
# (latest) and the upstream `main` branch: feature set unchanged, no
# `ring` opt-in exists. See docs/SECURITY-DEBT.md "Pending TLS gaps"
# for the deferred follow-up.
scylla           = { version = "1", default-features = false }
# Docker over the local socket or remote HTTP API.
# `http` + `pipe` are the bollard default features but we set
# `default-features = false` to keep `buildkit` etc out of the graph;
# add them back explicitly so `connect_with_http` (TCP transport) and
# `connect_with_socket` (unix socket / windows named pipe) compile.
bollard          = { version = "0.21", default-features = false, features = ["ssl", "http", "pipe"] }
md-5             = "0.10"
# Liquid templates for notification subject + body — familiar
# `{{ … | filter }}` syntax with filters, conditionals, and loops.
liquid           = "0.26"
hmac             = "0.12"
base64           = "0.22"
sha1             = "0.10"
urlencoding      = "2"
jsonwebtoken     = "10"
# Web Push (RFC 8291) — pure-Rust crypto stack, no openssl/C linkage.
# p256 covers both ECDH (payload key agreement) and ECDSA (VAPID ES256 JWT).
p256             = { version = "0.13", features = ["ecdh", "ecdsa", "pem"] }
hkdf             = "0.12"
aes-gcm          = "0.10"

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = true
opt-level     = 3
panic         = "abort"

[profile.dev]
opt-level = 1     # sqlx + axum are slow in opt-level 0
