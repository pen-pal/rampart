# Rampart · Rust workspace
#
# Crates:
#   rampart-core      — domain types, errors, IDs. No I/O.
#   rampart-db        — sqlx-backed repository layer over Postgres.
#   rampart-checker   — probe runners (HTTP today; TCP/DNS/browser later).
#   rampart-api       — axum HTTP server, the main bin.
#
# Run locally:
#   cp .env.example .env && docker compose up -d postgres
#   cargo run -p rampart-api
#
# Workspace dependencies are declared once below; member crates inherit via
# `dep = { workspace = true }`. This keeps versions aligned.

[workspace]
resolver = "2"
members  = [
  "crates/rampart-core",
  "crates/rampart-db",
  "crates/rampart-checker",
  "crates/rampart-scheduler",
  "crates/rampart-notifier",
  "crates/rampart-api",
]

[workspace.package]
edition      = "2021"
# MSRV is forced up by transitive deps (time 0.3.47, base64ct, etc. need
# edition2024 / rustc 1.88). The release Dockerfile pins rust:1.88 to match.
rust-version = "1.88"
license      = "AGPL-3.0-or-later"
repository   = "https://github.com/pen-pal/Rampart"

[workspace.dependencies]
# async runtime
tokio = { version = "1.40", features = ["full"] }

# web
axum       = { version = "0.7", features = ["macros", "http2", "tracing"] }
axum-extra = { version = "0.9", features = ["cookie", "typed-header"] }
tower      = { version = "0.5", features = ["util", "timeout", "limit"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "timeout", "request-id"] }
hyper      = { version = "1.4", features = ["full"] }

# database
# `mysql` is here (not in rampart-db) so the `mysql` probe can use the
# same sqlx instance. Cargo unifies features so this also lands in
# rampart-db's tree, which is a small compile-time cost we eat to keep
# from juggling two sqlx instances.
sqlx = { version = "0.8", features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "mysql",
  "uuid",
  "time",
  "json",
  "macros",
  "migrate",
  "ipnetwork",
] }

# serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# observability
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# errors
thiserror = "1"
anyhow    = "1"

# identity / time
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }
time = { version = "0.3", features = ["serde", "serde-well-known", "macros", "formatting"] }

# http client (for probe runners + outbound notifications)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "stream"] }

# SMTP for the email notification channel
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }

# misc
async-trait = "0.1"
validator   = { version = "0.20", features = ["derive"] }
argon2      = "0.5"
rand        = "0.8"
url         = "2.5"
once_cell   = "1.19"
regex       = "1.10"
sha2        = "0.10"
hex         = "0.4"
# TOTP — RFC 6238. `otpauth` feature builds the URI for the QR enrolment.
totp-rs     = { version = "5.6", features = ["otpauth"] }
base32      = "0.5"
futures     = "0.3"

# embedded frontend bundle — debug builds read from disk, release builds embed
rust-embed  = { version = "8", features = ["mime-guess"] }

# probe-specific crates
# DNS resolver for the `dns` monitor kind. Pure-rust, async, supports
# every record type the audience cares about (A/AAAA/CNAME/MX/TXT/NS/SRV/CAA/SOA).
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config"] }
# ICMP echo for the `ping` monitor kind. Userland — needs CAP_NET_RAW or
# unprivileged ICMP sockets (Linux: net.ipv4.ping_group_range; macOS: built-in).
surge-ping       = { version = "0.8" }
# TLS handshake + cert inspection for the `tls` monitor kind.
tokio-rustls     = { version = "0.26", default-features = false, features = ["ring"] }
rustls           = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile   = "2"
webpki-roots     = "0.26"
x509-parser      = "0.16"
# MSSQL driver — pure-rust, async, needs tokio-util's compat shim because
# tiberius is written against `futures-io` not `tokio::io`.
tiberius         = { version = "0.12", default-features = false, features = ["tds73", "chrono", "rustls"] }
tokio-util       = { version = "0.7", features = ["compat"] }
# Redis + MongoDB drivers for the remaining DB probes.
redis            = { version = "0.27", default-features = false, features = ["tokio-rustls-comp", "tls-rustls-webpki-roots"] }
mongodb          = "3"
# gRPC + MQTT probe deps
tonic            = { version = "0.12", default-features = false, features = ["transport", "codegen", "prost"] }
tonic-health     = { version = "0.12", default-features = false, features = ["transport"] }
prost            = "0.13"
rumqttc          = { version = "0.24", default-features = false, features = ["use-rustls"] }
# Docker over the local socket or remote HTTP API.
bollard          = { version = "0.17", default-features = false, features = ["ssl"] }
md-5             = "0.10"
# Liquid templates for notification subject + body — familiar
# `{{ … | filter }}` syntax with filters, conditionals, and loops.
liquid           = "0.26"
hmac             = "0.12"
base64           = "0.22"
sha1             = "0.10"
urlencoding      = "2"
jsonwebtoken     = "10"
# Web Push (RFC 8291) — pure-Rust crypto stack, no openssl/C linkage.
# p256 covers both ECDH (payload key agreement) and ECDSA (VAPID ES256 JWT).
p256             = { version = "0.13", features = ["ecdh", "ecdsa", "pem"] }
hkdf             = "0.12"
aes-gcm          = "0.10"

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = true
opt-level     = 3
panic         = "abort"

[profile.dev]
opt-level = 1     # sqlx + axum are slow in opt-level 0
